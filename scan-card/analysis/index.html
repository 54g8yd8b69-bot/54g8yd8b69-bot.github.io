<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Analysis Card, part of Scan Card: tooth widths, Bolton, space, arch form and occlusion measured on a scan. Runs on your own device.">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0B2E4A">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Scan Card">
<script>window.NOTILE={"fonts":false,"family":"'Source Sans 3'","home":"../","homeTitle":"Scan Card"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analysis Card — model analysis</title>
<style>
/* app-specific extras only — the core injects the shared look */
button{touch-action:manipulation}
.chart{margin:8px 0 4px;user-select:none;-webkit-user-select:none}
.chart .cap{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:1px}
.chart .crow{display:flex;gap:2px;align-items:stretch;margin:3px 0;opacity:.62}
.chart .crow.act{opacity:1}
.chart .mid{width:0;flex:none;border-left:2px solid var(--navy);margin:0 2px}
.chart .t{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:6px;background:#fff;padding:4px 0 2px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navy);line-height:1}
.chart .t b{font-size:11px;font-weight:700}
.chart .t i{font-style:normal;font-size:9px;color:#475569;font-variant-numeric:tabular-nums;min-height:9px;letter-spacing:-.2px}
.chart .t.done{background:var(--tealsoft);border-color:#5eead4}
.chart .t.half{background:#fffbeb;border-color:#fcd34d}
.chart .t.miss{background:#f1f5f9;color:#94a3b8;border-style:dashed}
.chart .t.miss b{text-decoration:line-through}
.chart .t.skip{color:#94a3b8;border-style:dotted}
.chart .t.cur{border-color:var(--teal2);box-shadow:0 0 0 2px rgba(20,184,166,.4)}
.chart .t:disabled{opacity:.35;cursor:not-allowed}
.prompt{display:flex;align-items:baseline;gap:8px;background:var(--navy);color:#fff;border-radius:8px;padding:8px 10px;margin:8px 0 6px}
.prompt b{font-size:14.5px;font-weight:600}
.prompt span{font-size:11px;color:#9fb6cf;margin-left:auto;white-space:nowrap}
.prompt.done{background:var(--teal2)}
.prompt.done span{color:#ccfbf1}
table.tbl td.k{color:#334155}
table.tbl tr.sum td{font-weight:600;color:var(--navy)}
table.tbl tr.dim td{color:#94a3b8}
table.tbl tr.pick{cursor:pointer}
table.tbl tr.pick:hover td{background:#f8fafc}
table.tbl tr.pick.sel td{background:#ccfbf1}
table.tbl td small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
table.tbl td .x{border:0;background:none;color:var(--muted);font-size:13px;padding:0 4px;line-height:1}
table.tbl td .x:hover{color:var(--bad)}
.flag{display:inline-block;font-size:9.5px;font-weight:600;border-radius:9px;padding:1px 6px;background:#fffbeb;color:#92400e;border:1px solid #fde68a;vertical-align:1px}
.btn.auto{border-style:dashed}
.btn.none{color:#94a3b8}
.row .unit{color:var(--muted);flex:none}
.row input.sm{width:58px}
.fine{margin:2px 0 0!important;font-size:11px!important}
.rep{white-space:pre-wrap;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:240px;overflow:auto;color:#0f172a;user-select:text;-webkit-user-select:text;margin:6px 0}
#labels .lbl.w{font-size:10.5px;padding:1px 5px;background:rgba(13,148,136,.92)}
#labels .lbl.sel{background:rgba(192,38,211,.95)}
#labels .lbl.gap{background:rgba(180,83,9,.95)}
#labels .lbl.blue{background:rgba(37,99,235,.95)}
#labels .lbl.tag{background:rgba(15,42,68,.85);font-weight:500}
#hint b{color:#fff;font-size:13px}
.panel{width:auto;min-width:150px}
.secp{position:absolute;left:10px;bottom:52px;width:min(480px,calc(100% - 20px));height:270px;background:#0b1d31;border:1px solid rgba(255,255,255,.28);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.45);overflow:hidden;z-index:3}
.secp canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.secp .cap{position:absolute;left:10px;top:7px;right:34px;color:#dbe7f3;font-size:11.5px;pointer-events:none}
.secp .x{position:absolute;right:5px;top:3px;border:0;background:none;color:#dbe7f3;font-size:15px;padding:3px 7px}
@media (max-width:820px){.secp{height:210px;bottom:48px}}
#sheet{position:absolute;inset:0;background:rgba(8,20,36,.9);overflow:auto;padding:14px 14px 50px;z-index:4;display:none;-webkit-overflow-scrolling:touch}
#sheet.show{display:block}
#sheet canvas{display:block;width:100%;max-width:1120px;height:auto;margin:0 auto;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.45);background:#fff}
</style>
</head><body>

// A stack of uint32 indices can can store the indices for
// a perfectly balanced tree with a depth up to 31. Lower stack
// depth gets higher performance.
//
// However not all trees are balanced. Best value to set this to

// Utilities
uvec4 uTexelFetch1D( usampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

ivec4 iTexelFetch1D( isampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 texelFetch1D( sampler2D tex, uint index ) {

	uint width = uint( textureSize( tex, 0 ).x );
	uvec2 uv;
	uv.x = index % width;
	uv.y = index / width;

	return texelFetch( tex, ivec2( uv ), 0 );

}

vec4 textureSampleBarycoord( sampler2D tex, vec3 barycoord, uvec3 faceIndices ) {

	return
		barycoord.x * texelFetch1D( tex, faceIndices.x ) +
		barycoord.y * texelFetch1D( tex, faceIndices.y ) +
		barycoord.z * texelFetch1D( tex, faceIndices.z );

}

void ndcToCameraRay(
	vec2 coord, mat4 cameraWorld, mat4 invProjectionMatrix,
	out vec3 rayOrigin, out vec3 rayDirection
) {

	// get camera look direction and near plane for camera clipping
	vec4 lookDirection = cameraWorld * vec4( 0.0, 0.0, - 1.0, 0.0 );
	vec4 nearVector = invProjectionMatrix * vec4( 0.0, 0.0, - 1.0, 1.0 );
	float near = abs( nearVector.z / nearVector.w );

	// get the camera direction and position from camera matrices
	vec4 origin = cameraWorld * vec4( 0.0, 0.0, 0.0, 1.0 );
	vec4 direction = invProjectionMatrix * vec4( coord, 0.5, 1.0 );
	direction /= direction.w;
	direction = cameraWorld * direction - origin;

	// slide the origin along the ray until it sits at the near clip plane position
	origin.xyz += direction.xyz * near / dot( direction, lookDirection );

	rayOrigin = origin.xyz;
	rayDirection = direction.xyz;

}

// Raycasting
bool intersectsBounds( vec3 rayOrigin, vec3 rayDirection, vec3 boundsMin, vec3 boundsMax, out float dist ) {

	// https://www.reddit.com/r/opengl/comments/8ntzz5/fast_glsl_ray_box_intersection/
	// https://tavianator.com/2011/ray_box.html
	vec3 invDir = 1.0 / rayDirection;

	// find intersection distances for each plane
	vec3 tMinPlane = invDir * ( boundsMin - rayOrigin );
	vec3 tMaxPlane = invDir * ( boundsMax - rayOrigin );

	// get the min and max distances from each intersection
	vec3 tMinHit = min( tMaxPlane, tMinPlane );
	vec3 tMaxHit = max( tMaxPlane, tMinPlane );

	// get the furthest hit distance
	vec2 t = max( tMinHit.xx, tMinHit.yz );
	float t0 = max( t.x, t.y );

	// get the minimum hit distance
	t = min( tMaxHit.xx, tMaxHit.yz );
	float t1 = min( t.x, t.y );

	// set distance to 0.0 if the ray starts inside the box
	dist = max( t0, 0.0 );

	return t1 >= dist;

}

bool intersectsTriangle(
	vec3 rayOrigin, vec3 rayDirection, vec3 a, vec3 b, vec3 c,
	out vec3 barycoord, out vec3 norm, out float dist, out float side
) {

	// https://stackoverflow.com/questions/42740765/intersection-between-line-and-triangle-in-3d
	vec3 edge1 = b - a;
	vec3 edge2 = c - a;
	norm = cross( edge1, edge2 );

	float det = - dot( rayDirection, norm );
	float invdet = 1.0 / det;

	vec3 AO = rayOrigin - a;
	vec3 DAO = cross( AO, rayDirection );

	vec4 uvt;
	uvt.x = dot( edge2, DAO ) * invdet;
	uvt.y = - dot( edge1, DAO ) * invdet;
	uvt.z = dot( AO, norm ) * invdet;
	uvt.w = 1.0 - uvt.x - uvt.y;

	// set the hit information
	barycoord = uvt.wxy; // arranged in A, B, C order
	dist = uvt.z;

	norm = side * normalize( norm );

	// add an epsilon to avoid misses between triangles
	uvt += vec4( TRI_INTERSECT_EPSILON );

	return all( greaterThanEqual( uvt, vec4( 0.0 ) ) );

}

bool intersectTriangles(
	// geometry info and triangle range
	sampler2D positionAttr, usampler2D indexAttr, uint offset, uint count,

	// ray
	vec3 rayOrigin, vec3 rayDirection,

	// outputs
	inout float minDistance, inout uvec4 faceIndices, inout vec3 faceNormal, inout vec3 barycoord,

:root{--navy:#0f2a44;--navy2:#16365a;--navy3:#1e4772;--teal:#14b8a6;--teal2:#0d9488;--tealsoft:#ccfbf1;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f4f7fa;--warn:#f59e0b;--bad:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;font-size:14px}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
#app{display:grid;grid-template-rows:48px 1fr;grid-template-columns:340px 1fr;height:100%;position:relative}
#top{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px;min-width:0}
#top .brand{font-weight:700;letter-spacing:.2px;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap;color:inherit;text-decoration:none}
#top .brand i{display:inline-block;width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--teal),#5eead4)}
#top .sub{color:#9fb6cf;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#top .sp{flex:1}
#topBtns{display:flex;gap:6px;flex:none}
#top button{background:var(--navy2);color:#e6f0fa;border:1px solid var(--navy3);border-radius:7px;padding:6px 10px;font-size:12px;white-space:nowrap}
#top button:hover{background:var(--navy3)}
#top button.on{background:var(--teal2);border-color:var(--teal)}
#side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#steps{flex:1;overflow:auto;padding:10px;-webkit-overflow-scrolling:touch}
.step{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden;background:#fff}
.step>h3{margin:0;font-size:13px;font-weight:600;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.step>h3 .n{width:22px;height:22px;border-radius:50%;background:#eef2f7;color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.step.done>h3 .n{background:var(--tealsoft);color:var(--teal2)}
.step.active{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.12)}
.step.active>h3 .n{background:var(--teal);color:#fff}
.step .body{display:none;padding:2px 12px 12px;font-size:12.5px}
.step.active .body{display:block}
.body p{margin:6px 0;color:var(--muted);line-height:1.45}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row label{flex:1;color:#334155}
.row input[type=number]{width:72px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
.row input[type=text]{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--line);border-radius:6px;font:inherit}
.row select{padding:5px;border:1px solid var(--line);border-radius:6px;font:inherit;max-width:170px;background:#fff}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--teal2)}
.row input[type=checkbox]{accent-color:var(--teal2)}
.row .val{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600;flex:none}
.btn{background:#fff;border:1px solid #cbd5e1;border-radius:7px;padding:6px 10px;font-size:12px;color:var(--navy)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal2);color:#fff;border-color:var(--teal2);font-weight:600}
.btn.pri:hover{background:var(--teal)}
.btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:7px;overflow:hidden;flex-wrap:nowrap}
.seg button{border:0;background:#fff;padding:6px 10px;font-size:12px;color:var(--navy);border-right:1px solid #e2e8f0}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.note{background:#f0fdfa;border:1px solid #99f6e4;color:#115e59;border-radius:8px;padding:7px 9px;font-size:12px;margin:8px 0;line-height:1.4}
.note.warn,.warn{background:#fffbeb;border-color:#fde68a;color:#92400e}
.note.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.h4{font-weight:600;font-size:12px;color:var(--navy);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.lead{font-size:12.5px;color:#0f172a;font-weight:500;margin:4px 0 8px;line-height:1.4}
.tip{display:none;background:#f8fafc;border-left:3px solid #99f6e4;padding:6px 8px;border-radius:0 6px 6px 0;margin:6px 0!important;font-size:11.5px!important}
.step.help .tip{display:block}
.qb{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font:700 11px/1 system-ui,sans-serif;cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
.step.help .qb{background:var(--teal);color:#fff;border-color:var(--teal)}
.opt{font-size:9.5px;font-weight:600;color:var(--muted);background:#f1f5f9;border-radius:9px;padding:2px 7px;text-transform:uppercase;letter-spacing:.3px}
.slot{display:flex;align-items:center;gap:8px;border:1px dashed #cbd5e1;border-radius:8px;padding:7px 9px;margin:6px 0}
.slot b{width:64px;color:var(--navy);font-size:12.5px;flex:none}
.slot .fn{flex:1;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.slot.ok{border-style:solid;border-color:#99f6e4;background:#f0fdfa}
.drop{border:2px dashed #cbd5e1;border-radius:9px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin:6px 0}
.drop:hover,.drop.over{border-color:var(--teal);color:var(--teal2)}
.kv{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
table.tbl th,table.tbl td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
table.tbl th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
#nav{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
#nav .btn{flex:1;padding:8px}
#nav #bNext{flex:2.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#view{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 30%,#1c3a5c 0%,#0b1d31 75%);overflow:hidden}
#view canvas{display:block;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(15,42,68,.88);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap;font-variant-numeric:tabular-nums}
#viewBtns{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
#viewBtns button{background:rgba(15,42,68,.8);color:#e6f0fa;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 8px;font-size:11px}
#viewBtns button:hover{background:rgba(30,71,114,.95)}
.panel{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.96);border-radius:10px;padding:10px;width:230px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:calc(100% - 60px);overflow:auto}
.panel .ph{all:unset;display:flex;align-items:center;width:100%;box-sizing:border-box;font-weight:600;font-size:12px;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;cursor:pointer;gap:10px}
.panel .ph::after{content:"\u25BE";margin-left:auto;color:var(--muted)}
.panel.collapsed{width:auto!important;min-width:0!important;padding:6px 9px}
.panel.collapsed .ph::after{content:"\u25B8"}
.panel.collapsed>:not(.ph){display:none!important}
.panel .row{margin:4px 0}
.panel .row label{display:flex;align-items:center;gap:6px}
.panel input[type=range]{width:80px;flex:none}
.legend{position:absolute;left:10px;bottom:46px;background:rgba(255,255,255,.95);border-radius:9px;padding:8px 10px;font-size:11.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:290px}
.legend div{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend i{width:14px;height:10px;border-radius:2px;flex:none}
#hint{position:absolute;left:10px;bottom:10px;color:#cfe0f1;font-size:11.5px;background:rgba(10,25,45,.6);padding:6px 9px;border-radius:7px;max-width:38%;pointer-events:none}
#hint:empty{display:none}
#status{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12px;padding:7px 12px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:60%;text-align:center;z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#status.show{opacity:1}
#status.err{background:#b91c1c}
#busy{position:absolute;inset:0;background:rgba(8,20,36,.55);display:none;place-items:center;color:#fff;font-size:14px;z-index:5}
#busy.show{display:grid}
#busy>div{background:var(--navy);padding:14px 20px;border-radius:10px;display:flex;gap:10px;align-items:center}
#busy>div::before{content:"";width:16px;height:16px;border:2px solid #5eead4;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#empty{position:absolute;inset:0;display:grid;place-items:center;color:#9fb6cf;pointer-events:none;text-align:center;font-size:14px;padding:20px}
#empty b{color:#fff;font-size:18px;display:block;margin-bottom:6px}
#view.over::after{content:"Drop scan here";position:absolute;inset:12px;border:2px dashed #5eead4;border-radius:14px;display:grid;place-items:center;color:#5eead4;font-size:18px;font-weight:600;background:rgba(11,29,49,.6);pointer-events:none}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:48px 46% 1fr}#side{grid-row:3;grid-column:1;border-right:0;border-top:1px solid var(--line)}#view{grid-row:2;grid-column:1}#top .sub{display:none}.panel{width:180px;padding:6px}#hint{max-width:60%}}
@media (max-width:520px){#top{gap:8px;padding:0 8px}#top .brand{font-size:14px;gap:6px}#top .brand i{width:18px;height:18px}#topBtns{gap:4px}#top button{padding:5px 7px;font-size:11px}
#viewBtns{left:8px;right:8px;bottom:8px;max-width:none;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;scrollbar-width:none}#viewBtns button{flex:none}
#hint{left:8px;right:8px;bottom:42px;max-width:none}.panel{top:8px;right:8px}}
html.embed #app{grid-template-rows:1fr}
html.embed #top{position:absolute;z-index:4;left:350px;top:10px;height:auto;background:none;padding:0;gap:0}
html.embed #top .brand,html.embed #top .sub,html.embed #top .sp{display:none}
html.embed #top button{background:rgba(15,42,68,.82);border-color:rgba(255,255,255,.3)}
html.embed #top button.on{background:var(--teal2);border-color:var(--teal)}
@media (max-width:820px){html.embed #app{grid-template-rows:46% 1fr}html.embed #view{grid-row:1}html.embed #side{grid-row:2}html.embed #top{left:8px;top:8px}}

onDropFiles:s=>vt.loadFiles(s),steps:[{id:"load",title:"Load scans",html:""},{id:"orient",title:"Check orientation",html:'<p class="tip">Everything measured \u201Cin the occlusal plane\u201D, and overjet, overbite and the midline, use the plane and midline set here \u2014 so get the biting surfaces level and the midline on the centre line before measuring. Landmarks stay on the scan if you come back and adjust this later, and the figures are worked out again.</p>'},{id:"widths",title:"Tooth widths",html:`
      <p class="lead">Click the two contact points of each tooth, working round the arch. Two clicks per tooth.</p>
      <div class="row"><label>Arch</label><div class="seg" id="wJaw"><button data-v="upper" type="button" title="Measure the upper teeth">Upper</button><button data-v="lower" type="button" title="Measure the lower teeth">Lower</button></div></div>
      <div class="chart" id="chart"></div>
      <div class="prompt" id="wPrompt"><b></b><span></span></div>
      <div class="btns">
        <button class="btn" id="wUndo" type="button" title="Take back the last click or change (Ctrl+Z)">Undo</button>
        <button class="btn" id="wMiss" type="button" title="This tooth is absent. Its space is kept and listed under Spaces.">Missing</button>
        <button class="btn" id="wSkip" type="button" title="The tooth is there but is left out of the analysis">Not measured</button>
        <button class="btn" id="wRedo" type="button" title="Clear this tooth\u2019s two points and click them again">Redo tooth</button>
      </div>
      <table class="tbl" id="wSums"></table>
      <div class="h4">Options</div>
      <div class="row"><label>Tooth numbers</label><div class="seg" id="wNot"><button data-v="fdi" type="button" title="Two-digit FDI numbers (16, 21 \u2026)">FDI</button><button data-v="palmer" type="button" title="Palmer quadrants (UR6, UL1 \u2026)">Palmer</button></div></div>
      <div class="row"><label>Width measured</label><div class="seg" id="wMode"><button data-v="plane" type="button" title="Distance between the two points measured parallel to the occlusal plane">In occlusal plane</button><button data-v="3d" type="button" title="Straight-line distance between the two points in 3D">Straight 3D</button></div></div>
      <div class="row"><label><input type="checkbox" id="w7"> Include second molars</label></div>
      <div class="row"><label><input type="checkbox" id="wLock" checked> Keep the occlusal view (no rotation)</label></div>
      <div class="btns"><button class="btn" id="wClear" type="button" title="Remove every landmark on this arch (Undo brings them back)">Clear this arch</button></div>
      <p class="tip"><b>What to click.</b> For each tooth click its mesial and its distal contact point \u2014 the two points furthest apart along the arch, where it touches (or would touch) its neighbours. The prompt names the next point; the order runs round the arch from the patient\u2019s right, so on the right side the distal point comes first. The view is a true parallel (orthographic) view straight onto the biting surfaces, so what you see is to scale.</p>
      <p class="tip"><b>How the width is worked out.</b> <i>In occlusal plane</i> (default): the distance between the two points measured parallel to the occlusal plane set in step 2, like calipers held level with the biting surfaces. It ignores any height difference between your two clicks, which you cannot control well from this view. A tooth whose mesio-distal axis is tipped out of the plane measures short by the cosine of the tip (about 6% at 20\xB0). <i>Straight 3D</i>: the true point-to-point distance \u2014 use it for a markedly tipped tooth, and turn the model to place both points at contact level.</p>
      <p class="tip"><b>Editing.</b> Drag any point to refine it. Click a tooth in the chart to jump to it. <i>Missing</i> = tooth absent (its space is kept and measured). <i>Not measured</i> = tooth present but left out. Either way the tooth is left out of the sums, and the Bolton step says so. Third molars and separate primary teeth are not charted.</p>`},{id:"bolton",title:"Bolton analysis",html:`
      <p class="lead">Tooth-size ratios, lower to upper, set against Bolton\u2019s values.</p>
      <div id="bOut"></div>
      <div class="row"><label><input type="checkbox" id="bSub"> Use the opposite side\u2019s width for a tooth with no width</label></div>
      <p class="tip"><b>Ratios.</b> Anterior = sum of the six lower front teeth \xF7 sum of the six upper front teeth \xD7 100. Overall = sum of the twelve lower teeth (first molar to first molar) \xF7 sum of the twelve upper teeth \xD7 100.</p>
      <p class="tip"><b>Size of the discrepancy.</b> As in Bolton\u2019s method: if the ratio is above his mean the lower teeth are relatively large, and the excess is lower sum \u2212 (upper sum \xD7 mean \xF7 100); if below, the upper teeth are relatively large, and the excess is upper sum \u2212 (lower sum \xD7 100 \xF7 mean). \u201COr shortfall\u201D is the same discrepancy seen from the other arch: how much larger that arch\u2019s teeth would need to be to reach the mean ratio.</p>
      <p class="tip"><b>Incomplete data.</b> A ratio is only calculated when every tooth it needs has a width. Ticking the box fills a gap with the width of the same tooth on the other side; the result is then marked as an estimate and names the teeth.</p>
      <p class="tip"><b>Sources.</b> Means, standard deviations and ranges: Bolton WA. Disharmony in tooth size and its relation to the analysis and treatment of malocclusion. <i>Angle Orthod</i> 1958;28:113\u2013130 \u2014 55 cases with excellent occlusion; overall ratio mean 91.3%, SD 1.91, range 87.5\u201394.8; anterior ratio mean 77.2%, SD 1.65, range 74.5\u201380.4. Size of the discrepancy: Bolton WA. The clinical application of a tooth-size analysis. <i>Am J Orthod</i> 1962;48:504\u2013529. How large a discrepancy matters is not agreed: Bolton suggested looking closer beyond 1 SD; many studies use 2 SD (e.g. Crosby &amp; Alexander 1989); Othman &amp; Harradine (<i>Angle Orthod</i> 2007;77:668\u2013674) recommend judging by the millimetres of correction needed, with 2 mm as their threshold. This app reports the figures and does not grade them.</p>`},{id:"space",title:"Spaces and space analysis",html:`
      <p class="lead">Spaces between the teeth, and space available against space required.</p>
      <div class="row"><label>Arch</label><div class="seg" id="sJaw"><button data-v="upper" type="button" title="Show the upper arch">Upper</button><button data-v="lower" type="button" title="Show the lower arch">Lower</button></div></div>
      <div class="h4">Spaces</div>
      <div id="sGaps"></div>
      <div class="row"><label>Ignore gaps under</label><input type="number" id="sTol" min="0" max="3" step="0.1" value="0.5" title="A gap between neighbouring teeth smaller than this is treated as a contact (it is within clicking error)"><span class="unit">mm</span></div>
      <div class="h4">Space analysis</div>
      <div id="sOut"></div>
      <div class="row"><label>Arch line</label><div class="seg" id="sSmooth"><button data-v="1" type="button" title="A smooth curve through the points">Curve</button><button data-v="0" type="button" title="Straight segments between the points">Segments</button></div></div>
      <div class="btns"><button class="btn" id="sDel" type="button" title="Remove the selected point of the arch line (or right-click / Alt-click a point)">Delete point</button><button class="btn" id="sReset" type="button" title="Draw the arch line again from the contact points">Reset line</button><button class="btn" id="sUndo" type="button" title="Take back the last change (Ctrl+Z)">Undo</button></div>
      <p class="tip"><b>Spaces.</b> Taken from the contact points picked in step 3. Between two neighbouring teeth the space is the separation of their facing contact points measured along the arch, so a tooth that is simply displaced in or out is not counted as a space. Where a tooth is marked missing, the span is the straight distance between the contact points either side of it.</p>
      <p class="tip"><b>Space analysis.</b> Space available = length of the arch line from the mesial contact of one first molar round to the mesial contact of the other. Space required = sum of the widths of the teeth between them. Available \u2212 required: negative = crowding, positive = spacing. Missing and unmeasured teeth add nothing to \u201Crequired\u201D and are named.</p>
      <p class="tip"><b>The arch line.</b> It starts as a smooth curve fitted to all your contact points, with seven points you can drag. Drag them to where the line of the arch should run; click on the line to add a point; select a point and press Delete point to remove it. Where teeth are crowded or displaced the line is your judgement of the corrected arch, and the result depends on it. On perfectly aligned test arches the curve read within 0.1 mm of the sum of the widths, while six straight segments read 0.4\u20130.7 mm short because they cut the corners \u2014 add points if you prefer segments.</p>`},{id:"arch",title:"Arch dimensions and occlusion",html:`
      <p class="lead">Arch widths and depth, and how the incisors meet.</p>
      <div class="row"><label>Show</label><div class="seg" id="aView"><button data-v="upper" type="button" title="Upper arch from the biting side: cusp tips, widths and depth">Upper</button><button data-v="lower" type="button" title="Lower arch from the biting side: cusp tips, widths and depth">Lower</button><button data-v="front" type="button" title="Both arches in the bite, from the front: incisal points and midlines">Front</button><button data-v="section" type="button" title="Both arches cut through the upper incisal point, seen from the patient\u2019s right: overjet and overbite">Section</button></div></div>
      <div id="aOut"></div>
      <div class="h4">Landmarks</div>
      <div class="btns" id="aChips"></div>
      <div class="btns"><button class="btn" id="aFind" type="button" title="Find the cusp tips and incisal edges again from the scan (replaces the ones you have moved, too)">Find again</button><button class="btn" id="aUndo" type="button" title="Take back the last change (Ctrl+Z)">Undo</button></div>
      <div id="aNote"></div>
      <p class="tip"><b>Intercanine width</b> = distance between the cusp tips of the right and left canines. <b>Intermolar width</b> = distance between the mesiobuccal cusp tips of the right and left first molars. <b>Arch depth</b> = distance, measured in the occlusal plane, from the incisor point (midway between the mesial contact points of the two central incisors) to the line joining the mesial contact points of the first molars, at right angles to that line.</p>
      <p class="tip"><b>Overjet</b> = from the upper incisal point straight back, parallel to the occlusal plane, to the labial surface of the lower incisors at that height (the most forward lower point within 1.5 mm either side). Negative = lower incisors in front. If the lower incisors do not reach that height it is measured to the lower incisal point instead, and says so. <b>Overbite</b> = how far the upper incisal point passes the lower incisal point, at right angles to the occlusal plane; negative = an open bite. <b>Midlines</b> = sideways distance between the upper and lower dental midlines (each midway between the mesial contact points of the central incisors). These three need both scans exported together in the bite.</p>
      <p class="tip"><b>Landmarks.</b> Cusp tips are found for you as the point of the crown nearest the opposing arch in the expected place (middle of the canine; mesial-buccal quarter of the first molar), and the incisal points as the middle of the edge of the more forward upper central incisor and the highest point of the lower incisors in line with it. They are a first guess: check each on the model and drag any that are off, or pick one in the list and click where it should be. Dashed buttons are still automatic. <i>Section</i> cuts both scans through the upper incisal point so the overjet and overbite lines can be checked against the profile of the incisors; there, a point is moved within the cut and snaps to the nearest surface.</p>`},{id:"resto",title:"Restorative space",optional:!0,html:`
      <p class="lead">For each space left by a missing tooth: its width at contact level and at the crest, the room to the opposing teeth, and a what-if for the planned tooth.</p>
      <div id="rList"></div>
      <div id="rSel"></div>
      <p class="tip"><b>Contact level</b> = straight distance between the contact points either side of the space (from step 3). <b>Crest level</b> = distance between two points you click on the neighbouring teeth at the gum margin. <b>Vertical space</b> = distance from the ridge point straight up or down (at right angles to the occlusal plane) to the first surface of the opposing scan; it needs both scans in the bite. The ridge point starts on the gum under the middle of the span \u2014 drag it to where you need the reading.</p>
      <p class="tip"><b>What-if.</b> Space at contact level minus the planned width(s). A planned width can be typed, or taken as a percentage of this patient\u2019s measured central incisor. No percentage is pre-set, because published proportions describe different things. Levin\u2019s golden proportion (lateral about 62% of central; <i>J Prosthet Dent</i> 1978;40:244\u2013252), Preston\u2019s measured 66% (<i>J Esthet Dent</i> 1993;5:247\u2013251) and Ward\u2019s RED proportion (70% preferred; <i>Dent Clin North Am</i> 2001;45:143\u2013154) all refer to the widths <i>seen from the front</i>, not the true mesio-distal widths measured here. Mean true widths reported for upper centrals and laterals (Magne et al., <i>J Prosthet Dent</i> 2003;89:453\u2013461; Orozco-Varo et al., <i>J Prosthet Dent</i> 2015;113:565\u2013570, as tabulated by Cinelli et al., <i>Dent J</i> 2024;12:3) work out at a lateral of about 77\u201378% of the central.</p>
      <p class="tip"><b>Implant sum.</b> Simple arithmetic on the numbers you enter: diameter + twice the clearance, set against the width at crest level (or contact level if no crest width is measured). A surface scan shows crowns and gum only \u2014 not roots or bone. For reference, Buser, Martin &amp; Belser (<i>Int J Oral Maxillofac Implants</i> 2004;19 Suppl:43\u201361) describe a zone about 1.0\u20131.5 mm wide next to each adjacent root to stay out of, and at least 3 mm between two adjacent implants. Nothing here is a recommendation.</p>`},{id:"measure",title:"Measure",optional:!0,html:`
      <p class="lead">Measure anything on the scans. The \u201CMeasure\u201D button in the top bar brings you here from any step and takes you back.</p>
      <div class="row"><label>Tool</label><div class="seg" id="mTool"><button data-v="d" type="button" title="Distance between two points">Distance</button><button data-v="a" type="button" title="Angle at the second of three points">Angle</button><button data-v="s" type="button" title="A straight cut down through two points: shows the outline of the scans there, to measure on">Section</button></div></div>
      <div id="mOut"></div>
      <div class="btns"><button class="btn" id="mUndo" type="button" title="Take back the last point or change (Ctrl+Z)">Undo</button><button class="btn" id="mClear" type="button" title="Remove every free measurement (Undo brings them back)">Clear all</button></div>
      <p class="tip"><b>Distance</b>: click two points. The list gives the straight 3D distance, and its parts in the occlusal plane and at right angles to it. <b>Angle</b>: click three points; the angle is at the second. <b>Section</b>: click two points; the scans that are showing are cut straight down through them (at right angles to the occlusal plane) and the outline appears in a panel, to scale. Click two places on the outline to measure between them \u2014 the clicks snap to the outline, and the list gives the distance with its parts along the cut and vertically. Drag any point on the model to adjust it. Measurements are saved with the case and listed in the report.</p>`},{id:"report",title:"Report",html:`
      <p class="lead">A summary of everything measured, for the notes or the lab.</p>

      <div class="btns"><button class="btn" id="pSheet" type="button" title="Show or hide the report sheet over the 3D view">Show the model</button></div>
      <div class="rep" id="pText" tabindex="0"></div>
      <div class="note">Planning and lab-communication aid \u2014 not a certified medical device. Every figure depends on the landmarks placed and on the orientation set in step 2. The report holds no patient details; add them where you file it.</div>
