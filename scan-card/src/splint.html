function exportMesh() { const m = { positions: D.meshCase.positions, indices: D.meshCase.indices }; return P.pos === 'scan' ? N.transformMesh(m, scans[D.jaw].matrix.clone().invert()) : m; }
$('exStl').addEventListener('click', async () => {
  if (!(await ensureBuilt())) return shell.status(D.error || 'Load a scan first', true);
  const r = await shell.busy('Writing STL…', async () => N.saveFile(`splint-${D.jaw}.stl`, N.stlBinary(exportMesh(), null, `Splint Card ${D.jaw} appliance, mm`)));
  shell.status(r.message, !r.ok && r.code !== 'declined');
});
$('exCase').addEventListener('click', () => scans.saveCase());

// ───────────── step changes ─────────────
shell.onStepChange(async (i) => {
  const id = shell.steps[i].id;
  if (BUILD_STEPS.includes(id) && pickJaw()) await ensureBuilt(); else { syncUI(); refreshView(); }
  if (id === 'path' && pickJaw() && D.arch) viewer.setView(D.jaw === 'upper' ? 'bottom' : 'top');
});
for (const [id, t] of [['bBack', 'Back to the previous step'], ['bNext', 'On to the next step']]) { const b = document.getElementById(id); if (b && !b.title) b.title = t; }
for (const b of document.querySelectorAll('[data-so=which] button')) if (!b.title) b.title = b.dataset.v === 'both' ? 'Turn both arches together' : `Turn the ${b.dataset.v} arch only`;      // the shared orientation step leaves these three without a tooltip
$('srcTip').innerHTML = '<b>Sources</b> (checked November 2026). <b>Fit clearance:</b> Formlabs’ application guide for splints gives an offset of 0.05–0.10 mm for Dental LT Clear V2 in 3Shape and exocad (0.01 to −0.03 mm for Dental LT Comfort). <b>Minimum thickness:</b> Formlabs’ manufacturing guide for Dental LT Comfort (PRNT-0106 rev 03, 2024) asks for at least 2 mm on occlusal surfaces and 1 mm on walls for splints and night guards. Other resins and printers differ, so follow the instructions for the resin you print. <b>Hinge:</b> an equilateral “Bonwill triangle” of 101.6 mm (4 in) between the two condyles and the lower incisal point, tilted 26° to the biting plane (“Balkwill angle”), puts the axis about 79 mm behind and 39 mm above the lower incisal edge. These are the classical averages as quoted by Xu &amp; Bu (2026, preprint), who themselves measured 101.0 mm and 22.7°; sides of 97–99 mm were measured on dry mandibles (J Adv Pharm Technol Res 2022;13(S1):S194–7). People differ, so the hinge opening is only an approximation.';
paramsToUI(); syncUI(); shell.goto(0);
S.ready();
window.APP = { N, S, K, shell, viewer, scans, P, get D() { return D; }, dots: () => dots, faceSection, showSection, opposing, gradeThickness, state: { P, get D() { return D; } }, ensureBuilt, touch, prep, refreshView, exportMesh, paramsToUI, kindColours, kindsFromColours };
</script>
