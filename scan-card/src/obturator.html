<script type="module">
// Obturator Card — obturators after a partial maxillectomy, designed on the upper scan.
//  • Hollow-bulb obturator (interim or definitive), from a scan taken after the resection that shows the defect (intraoral scan, or a
//    scanned impression or model): a palatal plate of set thickness out to the outline you tap, carrying a bulb that fills the defect up to
//    a set height above its margin, a set relief off its walls, with a closed top (flat or domed) that seals; hollowed to a set wall
//    thickness, either sealed inside or open at the top with a separate lid that plugs in.
//  • Surgical obturator, from a scan taken before the operation: a plate over the palate up to the planned resection line and a set
//    distance beyond it.
// Everything is designed along a path of insertion. The scan seen along the path is a height field (0.1 mm): its upper envelope is the
// tissue with every undercut blocked out, on the teeth and in the defect, so the result goes in and comes out along that path. The bulb
// may be allowed to engage a set amount of the defect's undercut.
// The prosthesis is a signed-distance field on a grid in the path's frame — distance to the blocked-out tissue (per slice by a distance
// transform, then exactly near the surfaces from the triangulated height field), to the outlines, to the cap and to a smooth surface
// spanning the defect — closed into a surface with surface nets. The bulb's own field is an intersection of true distances, so its hollow
// (the bulb field below −wall) keeps the wall thickness everywhere by construction; the walls are then measured.
import * as N from './core.js';
import * as SOL from './solid.js';
const THREE = N.THREE, $ = N.$, RHO = 1.19;                       // g/cm³: heat-cured PMMA denture base (printed denture-base resins are much the same)
const MODES = { hollow: 'Hollow-bulb obturator', surgical: 'Surgical obturator' }, INSIDE = { closed: 'Closed hollow', open: 'Open top with a lid', solid: 'Solid bulb' };

const P = { mode: 'hollow', ap: 0, lat: 0, margin: [], outline: [], cut: [], side: 'left', plate: 2.0, prelief: 0, height: 12, brelief: 0.5, wall: 2.0, top: 'flat', dome: 3, hollow: 'closed', under: 0, beyond: 3 };   // taps in the scan's own file coordinates
const KEYS = Object.keys(P);
const V = { section: false, cutAt: 0.5, lift: false };          // how the result is shown (not saved)
let B = null, SURV = null, PC = null;                            // B: the result; SURV: Survey's path, when the case has one; PC: the scan seen along the path

const shell = N.createShell({
