<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prep Card — preparation checker</title>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",

<style>
button{touch-action:manipulation}
.sum{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
.sum h5{margin:0;padding:6px 9px;background:#f8fafc;font-size:12px;color:var(--navy);display:flex;align-items:center;gap:6px}
.sum h5 .okb{margin-left:auto;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--tealsoft);color:var(--teal2)}
.sum h5 .okb.bad{background:#fee2e2;color:#991b1b}
.sum div{display:flex;padding:4px 9px;border-top:1px solid var(--line);font-size:12px}
.sum div span{flex:1;color:var(--muted)}
.sum div b{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600}
table.sides{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
table.sides th{font-weight:600;color:var(--muted);text-align:right;padding:3px 6px;font-size:11px}
table.sides th:first-child,table.sides td:first-child{text-align:left}
table.sides td{padding:4px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;color:var(--navy)}
table.sides td.neg{color:#b91c1c;font-weight:600}
.count{font-size:12px;color:var(--muted);margin:4px 0}
</style>
</head>

<script type="module">
// Prep Card — checks a tooth preparation on a scan: undercuts and anything blocking the path of insertion, the angle of each

    if (id !== 'tooth') {
      const d = new THREE.Vector3(...R.d), c = new THREE.Vector3(R.S.centre[0], R.S.centre[1], 0); let top = -Infinity; for (let f = 0; f < g.nF; f++) if (R.reg[f]) top = Math.max(top, g.cen[3 * f] * d.x + g.cen[3 * f + 1] * d.y + g.cen[3 * f + 2] * d.z);
      const zc = (top - c.x * d.x - c.y * d.y) / (d.z || 1); arrow = new THREE.ArrowHelper(d, new THREE.Vector3(c.x, c.y, zc).addScaledVector(d, 1.5), 9, 0xe879f9, 2.6, 1.6); arrow.userData.noFit = true; viewer.scene.add(arrow);
    }
    if (id === 'check' && P.map === 'clear' && R.clear && R.clear.at) { const v = new THREE.Vector3(...R.clear.at); marks.push({ m: viewer.marker(v, { color: 0x0f2a44, px: 12 }), l: viewer.label(`closest ${mm(R.clear.min)}`, v, { dy: -16 }) }); }
  }
  // the margin and the tooth tap
  if (loopLine) { loopLine.dispose(); loopLine = null; } for (const d of dots) viewer.scene.remove(d); dots = [];
  if (['tooth', 'path', 'check'].includes(id) && P.jaw) {
    const pts = P.loop.map((p) => new THREE.Vector3(...p)); if (pts.length >= 2) loopLine = viewer.line(pts, { color: 0xe879f9, width: 3, closed: pts.length >= 3, depthTest: false });
    if (id === 'tooth') { for (const p of pts) dots.push(viewer.marker(p, { color: 0xa21caf, px: 12 })); if (P.seed) dots.push(viewer.marker(new THREE.Vector3(...P.seed), { color: 0x0f2a44, px: 16 })); }
  }
  legend.hidden = !(R && (id === 'path' || id === 'check'));
  if (!legend.hidden) legend.innerHTML = id === 'path' || P.map === 'undercut' ? '<div><i style="background:#5eead4"></i>clear path</div><div><i style="background:#dc2626"></i>undercut</div><div><i style="background:#f97316"></i>another tooth in the way</div>'
    : P.map === 'taper' ? '<div><i style="background:#dc2626"></i>below 0° (undercut)</div><div><i style="background:linear-gradient(90deg,#dbeafe,#1e3a8a)"></i>0° … 25°+</div><div><i style="background:#e2e8f0"></i>occlusal surface</div>'
    : `<div><i style="background:#dc2626"></i>under ${P.target.toFixed(1)} mm</div><div><i style="background:#f59e0b"></i>${P.target.toFixed(1)} – ${(P.target + 0.5).toFixed(1)} mm</div><div><i style="background:#14b8a6"></i>more</div><div><i style="background:#e2e8f0"></i>not facing the opposing teeth</div>`;
  viewer.invalidate();
}

// ───────────── tapping the tooth and the margin ─────────────
const tapTool = {
  cursor: 'crosshair',
  onDown: () => false,                                           // dragging still turns the model; a tap (no movement) marks a point
  onClick: (i) => {
    if (i.button !== 0 || !pickJaw()) return; const h = i.pick([scans[P.jaw].object]); if (!h) return;
    const p = h.point.toArray(); if (!P.seed) P.seed = p; else P.loop.push(p);
    P.dir = null; analyse(); scans.touch(); refreshView();
  },
  onMove: () => {}, onUp: () => {},
};

// ───────────── controls ─────────────
const RB = { target: N.rangeBind('ckTgt', (v, done) => { P.target = v; if (done) { analyse(); scans.touch(); } else { if (R) paint(); } }, { fmt: (v) => v.toFixed(1) + ' mm' }) };
const SEG = {
  jaw: N.segBind($('ptJaw'), (v) => { if (!scans.has(v)) return syncUI(); P.jaw = v; P.seed = null; P.loop = []; P.dir = null; G = null; analyse(); refreshView(); }),
  map: N.segBind($('ckMap'), (v) => { P.map = v; paint(); syncUI(); }, P.map),
};
$('ptUndo').addEventListener('click', () => { if (P.loop.length) P.loop.pop(); else P.seed = null; analyse(); refreshView(); });
$('ptClear').addEventListener('click', () => { P.seed = null; P.loop = []; P.dir = null; analyse(); refreshView(); });
$('pbBest').addEventListener('click', () => { const g = geo(); if (!R || !g) return shell.status('Mark the prepared tooth first', true); g.reg = R.reg; P.dir = bestPath(g).toArray(); analyse(); scans.touch(); shell.status(`Path set ${R.tilt.toFixed(1)}° from the occlusal axis`); });
$('pbView').addEventListener('click', () => {
  if (!R) return shell.status('Mark the prepared tooth first', true); const v = viewer.camera.position.clone().sub(viewer.controls.target).normalize();
  if (v.dot(d0()) < Math.cos(40 * Math.PI / 180)) return shell.status('Look at the preparation from its occlusal side first', true); P.dir = v.toArray(); analyse(); scans.touch(); shell.status('Path set from this view');
});
$('pbReset').addEventListener('click', () => { P.dir = null; analyse(); scans.touch(); });
$('ckShot').addEventListener('click', async () => { const url = viewer.snapshot(), bin = atob(url.split(',')[1]), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); const r = await N.saveFile('preparation.png', new Blob([u8], { type: 'image/png' })); shell.status(r.message, !r.ok && r.code !== 'declined'); });
$('ckCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(figuresText()); shell.status('Figures copied'); } catch (_) { shell.status('Copying was not allowed here', true); } });
function figuresText() {
  if (!R) return ''; const s = R.sides, L = [`Preparation check (${NAME[P.jaw].toLowerCase()} arch), path ${R.tilt.toFixed(1)}° from the occlusal axis`];
  for (const k of SIDES) L.push(`${SIDE_NAME[k]}: wall angle ${isFinite(s[k].angle) ? deg(s[k].angle) : '–'}, wall height ${isFinite(s[k].height) ? mm(s[k].height) : '–'}`);
  L.push(`Total occlusal convergence: mesiodistal ${deg(R.tocMD)}, buccolingual ${deg(R.tocBL)}`, `Undercut: ${R.uSelf.toFixed(1)} mm² of ${R.total.toFixed(1)} mm²; another tooth in the way: ${R.uBlock.toFixed(1)} mm²`);
  if (R.clear) L.push(`Occlusal clearance (in the bite as scanned): closest ${mm(R.clear.min)}; ${(R.clear.below * 100).toFixed(0)}% of the occlusal surface under ${P.target.toFixed(1)} mm`);
  L.push(`Margin length ${R.margin.toFixed(1)} mm`); return L.join('\n');
}
function syncUI() {
  const jaw = pickJaw(), both = scans.has('upper') && scans.has('lower');
  $('ptJawRow').hidden = !both; for (const b of $('ptJaw').children) b.disabled = !scans.has(b.dataset.v); SEG.jaw(jaw || '');
  $('ptLead').textContent = !jaw ? 'Load a scan first.' : !P.seed ? 'Tap the prepared tooth.' : P.loop.length < 3 ? 'Now tap round the margin, in order, all the way round.' : 'Keep tapping round the margin if it is not yet all the way round, or go on to the path of insertion.';
  $('ptCount').textContent = P.seed ? `${P.loop.length} margin point${P.loop.length === 1 ? '' : 's'}${R ? ` · prepared surface ${R.total.toFixed(1)} mm²` : P.loop.length >= 3 ? ' · the tooth tap is not inside the margin' : ''}` : '';
  $('pbInfo').innerHTML = !R ? '<div class="note warn">Mark the prepared tooth first.</div>' : `<div class="sum"><h5>Path of insertion<span class="okb${R.uSelf + R.uBlock > 0.5 ? ' bad' : ''}">${R.uSelf + R.uBlock > 0.5 ? 'Not clear' : 'Clear'}</span></h5><div><span>From the occlusal axis</span><b>${R.tilt.toFixed(1)}°</b></div><div><span>Undercut</span><b>${R.uSelf.toFixed(1)} mm²</b></div><div><span>Another tooth in the way</span><b>${R.uBlock.toFixed(1)} mm²</b></div></div>`;
  $('ckTgtRow').hidden = P.map !== 'clear'; $('ckMap').querySelector('[data-v=clear]').disabled = !(R && R.clear);
  if (!R) $('ckOut').innerHTML = '<div class="note warn">Mark the prepared tooth first.</div>';
  else {
    const s = R.sides, f = (v, fn) => (isFinite(v) ? fn(v) : '–');
    $('ckOut').innerHTML = `<table class="sides"><tr><th>Side</th><th>Wall angle</th><th>Wall height</th></tr>${SIDES.map((k) => `<tr><td>${SIDE_NAME[k]}</td><td class="${s[k].angle < 0 ? 'neg' : ''}">${f(s[k].angle, deg)}</td><td>${f(s[k].height, mm)}</td></tr>`).join('')}</table>
      <div class="sum"><h5>Preparation</h5><div><span>Total occlusal convergence, mesiodistal</span><b>${f(R.tocMD, deg)}</b></div><div><span>Total occlusal convergence, buccolingual</span><b>${f(R.tocBL, deg)}</b></div>
      <div><span>Undercut</span><b>${R.uSelf.toFixed(1)} mm²</b></div><div><span>Another tooth in the way</span><b>${R.uBlock.toFixed(1)} mm²</b></div>
      ${R.clear ? `<div><span>Closest to the opposing teeth</span><b>${mm(R.clear.min)}</b></div><div><span>Occlusal surface under ${P.target.toFixed(1)} mm</span><b>${(R.clear.below * 100).toFixed(0)}%</b></div>` : '<div><span>Occlusal clearance</span><b>needs the opposing arch in the bite</b></div>'}
      <div><span>Margin length</span><b>${R.margin.toFixed(1)} mm</b></div><div><span>Path from the occlusal axis</span><b>${R.tilt.toFixed(1)}°</b></div></div>`;
  }
  shell.markDone('load', !!jaw); shell.markDone('tooth', !!R); shell.markDone('path', !!R); shell.markDone('check', !!R);
}
function refreshView() {
  const id = shell.current >= 0 ? shell.steps[shell.current].id : 'load', jaw = pickJaw();
  if (['tooth', 'path', 'check'].includes(id) && jaw) { for (const j of JAWS) if (scans[j] && scans[j].object.visible !== (j === jaw)) scans.setVisible(j, j === jaw); }
  else for (const j of JAWS) if (scans[j] && !scans[j].object.visible) scans.setVisible(j, true);
  if (id === 'tooth' && jaw) { if (viewer.tool !== tapTool) viewer.setTool(tapTool); shell.hint(!P.seed ? 'Tap the prepared tooth' : 'Tap round the margin'); } else if (viewer.tool === tapTool) { viewer.setTool(null); shell.hint(''); }
  paint();
}
shell.onStepChange(() => { if (R) analyse(); syncUI(); refreshView(); });
syncUI(); shell.goto(0);
window.APP = { N, THREE, shell, viewer, scans, P, get R() { return R; }, get G() { return G; }, analyse, measure, bestPath, figuresText, refreshView };
</script>
</body>
</html>
