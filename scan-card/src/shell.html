<script type="module">
// Shell Card — a provisional crown, a shell to reline, or a matrix, made from a second scan of the same arch.
//  • Provisional crown: the tooth's shape from a scan taken before the preparation (or a wax-up), hollowed to fit the
//    preparation with a cement space. It is the material that lies inside the "before" surface and outside the
//    preparation (plus the space), up to the margin.
//  • Shell to reline: the same outside shape, only a set thickness deep — an eggshell temporary relined in the mouth.
//  • Matrix: a clear shell over the wax-up for an injected or pressed mock-up or a chairside provisional, with optional
//    injection holes. It is made as seen from the biting side, so it has no undercuts and can be printed rigid.
//  • Spaced model (VFR): the wax-up model (a solid with its base, from Models) with a spacer of a set thickness over the
//    waxed-up teeth, tapering off at its edges. Print both; the lab makes a vacuum-formed retainer on the spaced model, fills
//    the spaced part with clear silicone (e.g. Exaclear) and seats it on the wax-up model: a clear matrix for injection moulding.
// The crown and shell are worked out on a 0.1 mm grid as signed distances to the two scans; the margin is followed along
// the tooth's surface (shortest paths between the tapped points), so a proclined incisor needs no axis.
import * as N from './core.js';
import * as SOL from './solid.js';
const THREE = N.THREE, $ = N.$, JAWS = ['upper', 'lower'], NAME = { upper: 'Upper', lower: 'Lower' }, mm = (v) => v.toFixed(2) + ' mm';
const MODES = { crown: 'Provisional crown', shell: 'Shell to reline', matrix: 'Matrix', spacer: 'Spaced model (VFR)' };
const TAPS = (m) => m === 'matrix' || m === 'spacer';           // modes that work from teeth taps
const P = { jaw: null, mode: 'crown', gap: 0.08, wall: 1.0, thick: 2.0, mgap: 0.05, reach: 9, height: 11, holes: true, holeD: 1.6, space: 1.5, sreach: 8, send: 3.5, sheight: 10.5, seed: null, loop: [], taps: [] };   // points in the scan's own file coordinates
let S = mkS(), B = null, PREP = null;                            // S: the second scan; B: the result; PREP: Prep check's marking, if the case has one
function mkS() { return { shape: null, rel: null, fit: null, self: false }; }   // rel: the second scan's file → the main scan's file coordinates

const shell = N.createShell({
  name: 'Shell Card', tagline: 'Shell temporaries and matrices', title: document.title,
  emptyHtml: '<div><b>Load the scan of the prepared arch</b>Drop it here, or use the demo.</div>',
  onDropFiles: (f) => scans.loadFiles(f),
  steps: [
    { id: 'load', title: 'Load scans', html: '' },
    { id: 'orient', title: 'Check orientation', html: '' },
    { id: 'make', title: 'What to make', html: `
      <div class="seg" id="mkMode"><button data-v="crown" type="button" title="A fitted provisional crown: the shape before the preparation, hollowed to fit it">Provisional crown</button><button data-v="shell" type="button" title="A thin shell of the same shape, relined in the mouth">Shell to reline</button><button data-v="matrix" type="button" title="A clear shell over a wax-up for a mock-up or a chairside provisional">Matrix</button><button data-v="spacer" type="button" title="The wax-up model with a spacer over the waxed teeth, to make a vacuum-formed retainer filled with clear silicone">Spaced model (VFR)</button></div>
      <p class="lead" id="mkLead"></p>
      <div class="row" id="mkJawRow"><label>Arch</label><div class="seg" id="mkJaw"><button data-v="upper" type="button">Upper</button><button data-v="lower" type="button">Lower</button></div></div>
      <p class="tip">A design aid. Check the result on the model and in the mouth before relying on it.</p>` },
    { id: 'shape', title: 'Shape to copy', html: `
      <p class="lead" id="shLead"></p>
      <div id="shModel"></div>
      <div class="btns" id="shBtns"><button class="btn pri" id="shFile" type="button" title="Choose the scan whose shape you want (STL, PLY or OBJ)">Load the scan</button><button class="btn" id="shSelf" type="button" title="The scan already loaded is the wax-up: make the matrix over it">This scan is the wax-up</button></div>
      <input type="file" id="shIn" accept=".stl,.ply,.obj" hidden>

    { id: 'teeth', title: 'Teeth', html: `
      <p class="lead" id="tLead"></p>

      <div class="btns"><button class="btn" id="tUndo" type="button" title="Take back the last point">Undo point</button><button class="btn" id="tClear" type="button" title="Start marking again">Start again</button><button class="btn" id="tPrep" type="button" title="Use the tooth and margin already marked on the Prep check tab" hidden>Use Prep check’s margin</button></div>
      <p class="tip" id="tTip"></p>` },
    { id: 'design', title: 'Design', html: `
      <p class="lead" id="dLead"></p>
      <div class="row" id="dGapRow"><label>Cement space</label><input type="range" id="dGap" min="0" max="0.3" step="0.01" value="0.08"><span class="val"></span></div>
      <div class="row" id="dWallRow"><label>Shell thickness</label><input type="range" id="dWall" min="0.5" max="2.5" step="0.1" value="1"><span class="val"></span></div>
      <div class="row" id="dThickRow"><label>Matrix thickness</label><input type="range" id="dThick" min="1" max="4" step="0.25" value="2"><span class="val"></span></div>
      <div class="row" id="dMGapRow"><label>Space over the teeth</label><input type="range" id="dMGap" min="0" max="0.3" step="0.01" value="0.05"><span class="val"></span></div>
      <div class="row" id="dReachRow"><label>Reach from each tap</label><input type="range" id="dReach" min="5" max="16" step="0.5" value="9"><span class="val"></span></div>
      <div class="row" id="dHeightRow"><label>Down from the tips</label><input type="range" id="dHeight" min="5" max="16" step="0.5" value="11"><span class="val"></span></div>

      <div class="row" id="dSReachRow"><label>Across the teeth</label><input type="range" id="dSReach" min="4" max="14" step="0.5" value="8"><span class="val"></span></div>
      <div class="row" id="dSEndRow"><label>Past the end teeth</label><input type="range" id="dSEnd" min="0" max="8" step="0.5" value="3.5"><span class="val"></span></div>
      <div class="row" id="dSHeightRow"><label>Down from the tips</label><input type="range" id="dSHeight" min="5" max="16" step="0.5" value="10.5"><span class="val"></span></div>
      <label class="check" id="dHolesRow"><input type="checkbox" id="dHoles" checked> Injection hole over each tapped tooth</label>
      <div class="row" id="dHoleDRow"><label>Hole diameter</label><input type="range" id="dHoleD" min="1" max="3" step="0.1" value="1.6"><span class="val"></span></div>
      <div class="btns"><button class="btn pri" id="dBuild" type="button" title="Work out the shape">Make it</button></div>
      <div id="dOut"></div>` },
    { id: 'export', title: 'Download', html: `
      <p class="lead">Download the result as an STL for printing, in the same position as the scan, or keep it in the case file.</p>
      <div class="btns"><button class="btn pri" id="xStl" type="button" title="Download the shape as an STL file">Download STL</button><button class="btn" id="xWax" type="button" title="Download the wax-up model itself (the model with its base), to print alongside the spaced model">Download the wax-up model</button><button class="btn" id="xCase" type="button" title="Save the scans, the second scan and the result as one case file">Save case</button></div>
      <p class="tip" id="xTip"></p>` },
  ],
});
const viewer = N.createViewer(shell.view);
N.addViewButtons(shell, viewer);
const legend = shell.panel('', 'legend'); legend.hidden = true;
const scans = N.createScanSet({
  shell, viewer, appName: 'Shell Card', loadStep: 'load', orientStep: 'orient',
  onChange: (what) => { if (what === 'visibility' || what === 'case') return; if (B && B.key !== mainKey()) clearResult(); syncUI(); refreshView(); },
  extendCase: (c) => {
    c.remove('shell-shape'); c.remove('shell-part');
    const jaw = pickJaw(), M = jaw && scans[jaw].matrix;
    if (S.shape && S.rel && M) c.add({ role: 'shell-shape', name: S.shape.name || 'shape', mesh: S.shape, matrix: M.clone().multiply(S.rel), meta: { jaw, fit: S.fit } });
    if (B && B.mesh && M) c.add({ role: 'shell-part', name: `${P.mode}-${jaw}`, mesh: N.transformMesh(B.mesh, M.clone().invert()), matrix: M.clone(), meta: { jaw, mode: P.mode } });
    c.data.shell = { version: 1, jaw, mode: P.mode, self: S.self, gap: P.gap, wall: P.wall, thick: P.thick, mgap: P.mgap, reach: P.reach, height: P.height, holes: P.holes, holeD: P.holeD, space: P.space, sreach: P.sreach, send: P.send, sheight: P.sheight, seed: P.seed, loop: P.loop, taps: P.taps, info: B ? B.info : null };
  },
  readCase: (c) => {
    S = mkS(); B = null; const d = c.data.shell;
    PREP = c.data.prep && c.data.prep.seed && c.data.prep.loop && c.data.prep.loop.length >= 3 ? c.data.prep : null;
    if (d) Object.assign(P, { jaw: d.jaw ?? P.jaw, mode: MODES[d.mode] ? d.mode : 'crown', gap: d.gap ?? P.gap, wall: d.wall ?? P.wall, thick: d.thick ?? P.thick, mgap: d.mgap ?? P.mgap, reach: d.reach ?? P.reach, height: d.height ?? P.height, holes: d.holes ?? P.holes, holeD: d.holeD ?? P.holeD, space: d.space ?? P.space, sreach: d.sreach ?? P.sreach, send: d.send ?? P.send, sheight: d.sheight ?? P.sheight, seed: d.seed || null, loop: d.loop || [], taps: d.taps || [] });

    const jaw = pickJaw(), sh = c.get('shell-shape'); if (sh && jaw) { S.shape = sh.mesh; S.rel = scans[jaw].matrix.clone().invert().multiply(sh.matrix); S.fit = (sh.meta && sh.meta.fit) || null; }
    const part = c.get('shell-part'); if (part && jaw) { B = { mesh: N.transformMesh(part.mesh, part.matrix), info: d && d.info, key: mainKey() }; thicknessOf(B); }
    for (const [k, rb] of Object.entries(RB)) rb.set(P[k]); SEG.mode(P.mode); $('dHoles').checked = P.holes;
  },
});
function pickJaw() { if (P.jaw && scans.has(P.jaw)) return P.jaw; P.jaw = scans.has('lower') && !scans.has('upper') ? 'lower' : scans.has('upper') && !scans.has('lower') ? 'upper' : scans.has('lower') ? 'lower' : null; return P.jaw; }
const mainKey = () => { const j = pickJaw(), sc = j && scans[j]; return sc ? j + ':' + sc.raw.positions.length + ':' + N.crc32(new Uint8Array(sc.raw.positions.buffer, sc.raw.positions.byteOffset, Math.min(sc.raw.positions.byteLength, 120000))) + ':' + sc.matrix.elements.join(',') : null; };
const toCase = (p) => new THREE.Vector3(...p).applyMatrix4(scans[pickJaw()].matrix);
const toFile = (v) => v.clone().applyMatrix4(scans[pickJaw()].matrix.clone().invert()).toArray();
const shapeMatrix = () => scans[pickJaw()].matrix.clone().multiply(S.rel);
function clearResult() { B = null; }

// ───────────── surfaces: closest points, which side, distances ─────────────
const Q = new Map();                                             // cache: key → { bvh, idx, fn, or, mesh }
function surf(mesh, key) {

  const bvh = new N.MeshBVH(g), Pm = mesh.positions, nF = idx.length / 3, fn = new Float32Array(nF * 3);
  for (let f = 0; f < nF; f++) { const a = idx[3 * f] * 3, b = idx[3 * f + 1] * 3, c = idx[3 * f + 2] * 3, ux = Pm[b] - Pm[a], uy = Pm[b + 1] - Pm[a + 1], uz = Pm[b + 2] - Pm[a + 2], wx = Pm[c] - Pm[a], wy = Pm[c + 1] - Pm[a + 1], wz = Pm[c + 2] - Pm[a + 2]; fn[3 * f] = uy * wz - uz * wy; fn[3 * f + 1] = uz * wx - ux * wz; fn[3 * f + 2] = ux * wy - uy * wx; }

  const up = pickJaw() === 'upper' ? -1 : 1; let zt = -Infinity; for (let i = 2; i < Pm.length; i += 3) if (up * Pm[i] > zt) zt = up * Pm[i];

}
const mainSurf = () => surf(scans.framed(pickJaw()), 'main|' + mainKey());
const shapeMesh = () => (S.self ? scans.framed(pickJaw()) : N.transformMesh(S.shape, shapeMatrix()));
const shapeSurf = () => (S.self ? mainSurf() : surf(shapeMesh(), 'shape|' + mainKey() + '|' + S.rel.elements.join(',') + '|' + S.shape.positions.length));
/** signed distance to a surface: + outside the teeth, − inside; hit gets the closest point and triangle */
function sd(o, q, hit) {
  o.bvh.closestPointToPoint(q, hit); const f = hit.faceIndex;
  const side = ((q.x - hit.point.x) * o.fn[3 * f] + (q.y - hit.point.y) * o.fn[3 * f + 1] + (q.z - hit.point.z) * o.fn[3 * f + 2]) * o.or;
  return side >= 0 ? hit.distance : -hit.distance;
}

// ───────────── the second scan ─────────────
async function lineUp() {
  const jaw = pickJaw(); if (!S.shape || !jaw) return;
  await shell.busy('Lining the scans up…', async () => {
    await N.sleep(30); const ref = mainSurf(), start = N.autoOrient(S.shape, jaw).matrix, r = N.alignScans(S.shape, scans.framed(jaw), { start, bvh: ref.bvh });
    S.rel = scans[jaw].matrix.clone().invert().multiply(r.matrix); S.fit = { rms: r.rms, kept: r.kept };
  });
  B = null; scans.touch(); syncUI(); refreshView();
}

// ───────────── the margin, followed along the tooth's surface ─────────────
let GR = null;                                                   // { key, graph }
function graphOf(M, key) { if (!GR || GR.key !== key) GR = { key, graph: N.vertexGraph(M) }; return GR.graph; }
function nearestVertex(o, p) { const hit = {}; o.bvh.closestPointToPoint(p, hit); const f = hit.faceIndex, P0 = o.mesh.positions; let best = -1, bd = Infinity; for (let k = 0; k < 3; k++) { const v = o.idx[3 * f + k], d = Math.hypot(P0[3 * v] - p.x, P0[3 * v + 1] - p.y, P0[3 * v + 2] - p.z); if (d < bd) { bd = d; best = v; } } return best; }
/** per vertex of the prepared scan: distance along the surface from the margin, negative inside it (on the preparation), up to ±6 mm */
function marginField() {
  const jaw = pickJaw(), o = mainSurf(), M = o.mesh, P0 = M.positions, nV = P0.length / 3, g = graphOf(M, mainKey());
  const seed = toCase(P.seed), loop = P.loop.map(toCase), sv = nearestVertex(o, seed), lv = loop.map((p) => nearestVertex(o, p));
  const R2 = 15 * 15, allow = (v) => (P0[3 * v] - seed.x) ** 2 + (P0[3 * v + 1] - seed.y) ** 2 + (P0[3 * v + 2] - seed.z) ** 2 < R2;
  const wall = new Uint8Array(nV);

    const a = lv[i], b = lv[(i + 1) % lv.length]; if (a === b) { wall[a] = 1; continue; }
    const r = N.surfaceDistances(M, g, [[a, 0]], { allow, stopAt: b }); if (r.prev[b] < 0 && a !== b) return { error: 'The margin points could not be joined along the tooth. Tap them closer together, in order round the tooth.' };
    for (let v = b; v >= 0; v = r.prev[v]) { wall[v] = 1; if (v === a) break; }
  }
  if (wall[sv]) return { error: 'The tooth tap lies on the margin: tap the middle of the prepared tooth first.' };
  const inside = new Uint8Array(nV), stack = [sv]; inside[sv] = 1; let leak = false;
  while (stack.length) { const v = stack.pop(); for (let e = g.start[v]; e < g.start[v + 1]; e++) { const w = g.list[e]; if (inside[w] || wall[w]) continue; if (!allow(w)) { leak = true; continue; } inside[w] = 1; stack.push(w); } }
  if (leak) return { error: 'The margin does not close round the tooth: add points where it has a gap, all the way round.' };
  const src = []; for (let v = 0; v < nV; v++) if (wall[v]) src.push([v, 0]);

  for (let v = 0; v < nV; v++) { const d = Math.min(6, dd[v]); s[v] = inside[v] ? -d : d; }

function interpAt(o, hit, val) {                                   // a per-vertex value at the closest point, by barycentric weights

  const ax = P0[3 * a], ay = P0[3 * a + 1], az = P0[3 * a + 2], v0x = P0[3 * b] - ax, v0y = P0[3 * b + 1] - ay, v0z = P0[3 * b + 2] - az, v1x = P0[3 * c] - ax, v1y = P0[3 * c + 1] - ay, v1z = P0[3 * c + 2] - az, v2x = p.x - ax, v2y = p.y - ay, v2z = p.z - az;
  const d00 = v0x * v0x + v0y * v0y + v0z * v0z, d01 = v0x * v1x + v0y * v1y + v0z * v1z, d11 = v1x * v1x + v1y * v1y + v1z * v1z, d20 = v2x * v0x + v2y * v0y + v2z * v0z, d21 = v2x * v1x + v2y * v1y + v2z * v1z, den = d00 * d11 - d01 * d01;

// ───────────── making it ─────────────
/** a field sampled on a fine grid, worked out exactly only near its surface (a coarse grid says where that is) */
async function sampleBand(lo, hi, h, f, band = 0.45) {
