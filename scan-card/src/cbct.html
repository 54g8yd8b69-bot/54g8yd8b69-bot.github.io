<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBCT Card — CBCT viewer, donor-tooth replicas and root canals</title>
<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
 "three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.8/build/index.module.js"
}}
</script>
<style>
button{touch-action:manipulation}
#cb{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;z-index:1;background:#08131f;min-width:0;min-height:0}
#cbBar{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#0f2a44;border-bottom:1px solid #1e4772;flex-wrap:wrap;min-width:0}
#cbBar .seg{border-color:#1e4772}
#cbBar .seg button{padding:5px 9px;font-size:11.5px;background:#16365a;color:#dbe7f3;border-right-color:#1e4772}
#cbBar .seg button.on{background:var(--teal2);color:#fff}
#cbBar .btn{padding:5px 9px;font-size:11.5px;background:#16365a;color:#dbe7f3;border-color:#1e4772}
#cbBar .sp{flex:1}
#cbBar .rd{color:#9fb6cf;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
#cbBar .btn.on{background:var(--teal2);color:#fff;border-color:var(--teal2)}
#cbImg{flex-basis:100%;display:flex;gap:6px 18px;align-items:center;flex-wrap:wrap;padding:3px 0 1px}
#cbImg[hidden]{display:none}
#cbImg label{display:flex;align-items:center;gap:7px;color:#dbe7f3;font-size:11.5px;min-width:0}
#cbImg input[type=range]{width:120px;accent-color:#2dd4bf}
#cbImg .val{color:#9fb6cf;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
html.embed #cbBar{padding-left:8px}
#cbGrid{display:grid;gap:2px;min-height:0;min-width:0;background:#08131f}
#cbGrid.mpr{grid-template:"ax co" 1fr "sa r3" 1fr / 1fr 1fr}
#cbGrid.big3d{grid-template:"r3 ax" 1fr "r3 co" 1fr "r3 sa" 1fr / 2.2fr 1fr}
#cbGrid.pano{grid-template:"ax xs" 1fr "pan pan" 1fr / 1fr 1.5fr}
#cbGrid.max{grid-template:"m" 1fr / 1fr}
#cbGrid>[data-a]{min-width:0;min-height:0}
.vp{position:relative;overflow:hidden;background:#000}
.vp>canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none}
.vp.r3.pulp{background:radial-gradient(120% 95% at 50% 42%,#3d6a9c 0%,#284a78 38%,#142a4c 72%,#0a1830 100%)}
.vp .vl{position:absolute;left:6px;top:5px;font:600 11px/1.3 system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 36px);overflow:hidden;text-overflow:ellipsis}
.vp .vl i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.vp .vx{position:absolute;right:5px;top:4px;display:flex;gap:3px;z-index:2}
.vp .vx button{background:rgba(15,42,68,.85);color:#e6f0fa;border:1px solid rgba(255,255,255,.3);border-radius:5px;font-size:11px;padding:2px 7px}
.vp .vs{position:absolute;right:8px;bottom:6px;width:42%;max-width:220px;accent-color:#14b8a6;z-index:2}
#xsRow{display:flex;gap:2px;min-width:0}
#xsRow .vp{flex:1}
.vp.r3 .r3b{position:absolute;right:5px;bottom:5px;display:flex;gap:3px;z-index:2}
.vp.r3 .r3b button{background:rgba(15,42,68,.85);color:#e6f0fa;border:1px solid rgba(255,255,255,.3);border-radius:5px;font-size:11px;padding:2px 7px}
.sum{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
.sum h5{margin:0;padding:6px 9px;background:#f8fafc;font-size:12px;color:var(--navy);display:flex;align-items:center;gap:6px}
.sum h5 .okb{margin-left:auto;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:9px;background:var(--tealsoft);color:var(--teal2)}
.sum h5 .okb.bad{background:#fee2e2;color:#991b1b}
.sum h5 .okb.warn{background:#fef3c7;color:#92400e}
.sum div{display:flex;padding:4px 9px;border-top:1px solid var(--line);font-size:12px;gap:8px}
.sum div span{flex:1;color:var(--muted)}
.sum div b{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600;text-align:right}
.series{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px;margin:5px 0;background:#fff;color:var(--ink);font-size:12px}
.series.on{border-color:var(--teal);box-shadow:0 0 0 3px rgba(20,184,166,.15)}
.series:disabled{opacity:.6;cursor:not-allowed}
.series b{color:var(--navy)}
.series span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.row select{max-width:120px}
.step .body .row .val{width:74px}
.prog{height:4px;background:#e2e8f0;border-radius:2px;overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--teal);width:0}
</style>
</head>
<body>
<script type="module">
// CBCT Card — a CBCT viewer, donor-tooth replicas and root canals, part of Scan Card (its CBCT tab) or on its own.
//  • Opens DICOM on this device (several files, a folder, a .zip, multi-frame files; see dicom.js). Only technical tags are
//    read: the patient's details are stepped over by the reader and never reach this page, a saved case or an export.
//  • Axial, coronal and sagittal slices with a linked cross-hair that can be turned (oblique slices, square to each other),
//    windows, zoom and pan; a 3D view (maximum intensity or a
//    threshold surface, raymarched in a 3D texture) and a surface model as STL.
//  • Panoramic: a curve along the arch (tapped, or proposed from the bright band of the teeth), a curved reformation with a
//    slab, and cross-sections square to the curve with millimetre ticks. Distances and angles on any view.
//  • A tooth: tap it; it is cut out of the bone and its neighbours inside an adjustable cylinder (threshold, then a flood
//    from the tap against the region's edge that meets in the dark ligament space and at narrow contacts); fix leaks with
//    "not tooth" taps and an eraser; a smooth closed replica, optionally enlarged for the ligament and with a handle, as STL.
//  • Root canals: the pulp chamber and canals inside the picked tooth (the dark space shut inside its hard tissue, or open
//    only at the root end), red in the slices and a bright solid inside a glass tooth in 3D; the slices can be turned to run
//    along the tooth; as STL.
// Positions are the scan's own patient coordinates (LPS, mm), and so are the exported STL files.
import * as N from './core.js';
import * as D from './dicom.js';
const THREE = N.THREE, $ = N.$, mm = (v, d = 1) => `${v.toFixed(d)} mm`;
const SL = ['ax', 'co', 'sa'], SLICE = new Set(SL);
// The three slice views' planes, in patient millimetres: u runs across the view (to the right), v down it and n is the way the
// slice moves on scrolling. Straight, they are the scan's own axes; turned, they stay square to each other (see turnIn).
const FR0 = { ax: { u: [1, 0, 0], v: [0, 1, 0], n: [0, 0, 1] }, co: { u: [1, 0, 0], v: [0, 0, -1], n: [0, 1, 0] }, sa: { u: [0, 1, 0], v: [0, 0, -1], n: [1, 0, 0] } };
const frames0 = () => JSON.parse(JSON.stringify(FR0));
const COL = { ax: '#f59e0b', co: '#22d3ee', sa: '#e879f9', pan: '#a3e635', xs: '#a3e635', tooth: '#2dd4bf', not: '#f87171', meas: '#fde047', roi: '#38bdf8' };
const TITLE = { ax: 'Axial', co: 'Coronal', sa: 'Sagittal', pan: 'Panoramic', xs: 'Cross-section', r3: '3D' };
const EMPTY = '<div><b>Open a CBCT scan</b>Drop the DICOM folder, files or a .zip here, or use “Open the scan”. It stays on this device.</div>';

// ───────────── state ─────────────
const S = {
  vol: null, H: null, P: null, series: [], seriesId: null, skipped: 0, files: 0,
  cur: [0, 0, 0], win: { l: 0, w: 1 }, sharp: 0, preset: 'bone', tool: 'browse', layout: 'mpr', max: null,
  fr: frames0(), frVer: 0, rotating: null, rotTag: null,
  measures: [], draft: null,
  arch: { points: [], curve: null, ver: 0, slab: 10, mode: 'mean', s: 0, count: 3, step: 2, width: 30 },
  pano: null, xs: [],
  r3: { mode: 'mip', iso: 0, showSurf: true },
  surf: { mesh: null, info: null, detail: 0.5, largest: false, T: null },
  tooth: { seeds: [], not: [], erase: [], roi: null, T: null, smooth: 0.15, brush: 1, seg: null, rules: null, model: null, preview: null, hist: [], fitted: false },
  rep: { pdl: 0, handle: false, hd: 3, hl: 8, fdi: '', mesh: null, info: null },
  canal: { T: null, seg: null, mesh: null, meshP: null, show: 'glass', pres: 'show', ver: 0 },
  pending: null, demo: null, busy: false, loads: 0,
};

// ───────────── shell ─────────────
const fdiOpts = ['<option value="">—</option>'].concat([1, 2, 3, 4].flatMap((q) => [1, 2, 3, 4, 5, 6, 7, 8].map((t) => `<option value="${q}${t}">${q}${t}</option>`))).join('');
const shell = N.createShell({
  name: 'CBCT Card', tagline: 'CBCT viewer, donor-tooth replicas and root canals', title: document.title, emptyHtml: EMPTY,
  steps: [
    { id: 'load', title: 'Open the scan', html: `
      <p class="lead">Open the CBCT’s DICOM files: the folder they are in, a .zip, or the files themselves.</p>
      <div class="btns"><button class="btn pri" id="lFolder" type="button" title="Choose the folder that holds the scan’s DICOM files">Choose a folder…</button><button class="btn" id="lFiles" type="button" title="Choose DICOM files, a multi-frame file or a .zip">Choose files…</button><button class="btn" id="lDemo" type="button" title="Open a made-up CBCT of a lower jaw to try the tool">Try the demo CBCT</button></div>
      <input type="file" id="lFolderIn" webkitdirectory multiple hidden><input type="file" id="lFilesIn" multiple hidden>
      <div class="prog" id="lProg" hidden><i></i></div>
      <div id="lSeries"></div><div id="lInfo"></div>
      <div class="btns"><button class="btn" id="lFlip" type="button" title="Turn the scan over, top to bottom: for a scan whose files do not say which way up it is and that shows upside-down" hidden>Flip top to bottom</button></div>
      <p class="tip">Everything is read on this device; nothing is uploaded. Only technical details are read from the files (size, voxel size, position, scan date): names, dates of birth, numbers and the like are stepped over and never shown or saved. If the scan is compressed with JPEG 2000 or JPEG-LS, export it again from the CBCT software as uncompressed DICOM.</p>` },
    { id: 'view', title: 'Slices', html: `
      <p class="lead">Scroll over a slice to move through it; tap to move the cross-hair. Drag a round handle on a cross-hair line to turn the lines: the other two slices follow at that angle. Pinch or Ctrl + scroll to zoom; two fingers or the right mouse button to pan.</p>
      <div class="row"><label>Window</label><div class="seg" id="vPreset"><button data-v="bone" type="button" title="Bone and teeth">Bone</button><button data-v="teeth" type="button" title="Enamel, dentine and pulp">Teeth</button><button data-v="soft" type="button" title="Soft tissue and airway">Soft</button><button data-v="full" type="button" title="Every value in the scan">Full</button></div></div>
      <div class="row"><label>Level</label><input type="range" id="vLevel" step="1"><span class="val"></span></div>
      <div class="row"><label>Width</label><input type="range" id="vWidth" step="1"><span class="val"></span></div>
      <div class="row"><label>Sharpness</label><input type="range" id="vSharp" min="-100" max="100" step="5" value="0"><span class="val"></span></div>
      <div class="btns"><button class="btn" id="vFit" type="button" title="Show each slice whole again">Fit the slices</button><button class="btn" id="vCentre" type="button" title="Put the cross-hair back in the middle of the scan">Centre the cross-hair</button><button class="btn" id="vStraight" type="button" title="Turn the cross-hair back square to the scan">Straighten the cross-hair</button></div>
      <div id="vInfo"></div>
      <p class="tip">Use the bar above the slices for the tools: Point moves the cross-hair, Move pans, Window changes brightness and contrast (drag up and down for level, across for width), Image opens brightness, contrast and sharpness sliders on any step, Distance and Angle measure on any slice — the panoramic and cross-sections too. Measurements are in millimetres in the plane of the slice. The window presets and the sharpness are display settings only: sharpening makes edges and fine canals stand out and noise with them (below 0 it smooths instead); nothing is measured or outlined from the sharpened picture.</p>
      <p class="tip">Turning the cross-hair: with Point, drag one of the round handles on its lines. The other two slices turn with the lines and become oblique slices, still square to each other and to the slice you turned it in — for example, turn it in the axial slice to lie along the arch, then in the cross-cut slice to follow a tooth’s long axis. The angle shows by the handle and in each slice’s label; it settles on straight within half a degree. With a slice selected, [ and ] turn its lines 1° at a time (0.1° with Shift). “Straighten” puts every slice back square to the scan.</p>` },
    { id: 'd3', title: '3D and surface', optional: true, html: `
      <p class="lead">The scan in 3D: the brightest value along each line of sight (MIP), or the surface where it crosses a threshold. Make that surface into an STL model.</p>
      <div class="row"><label>Show</label><div class="seg" id="tMode"><button data-v="mip" type="button" title="Maximum intensity projection">MIP</button><button data-v="iso" type="button" title="The surface at the threshold below">Surface</button></div></div>
      <div class="row"><label>Threshold</label><input type="range" id="tIso" step="1"><span class="val"></span></div>
      <div class="btns"><button class="btn" id="tBone" type="button" title="A threshold that keeps the bone">Bone</button><button class="btn" id="tTeeth" type="button" title="A threshold that keeps mostly the teeth">Teeth</button></div>
      <div class="h4">Surface model</div>
      <div class="row"><label>Detail</label><div class="seg" id="tDetail"><button data-v="0.8" type="button" title="0.8 mm grid: quick, small file">Coarse</button><button data-v="0.5" type="button" title="0.5 mm grid">Normal</button><button data-v="0.3" type="button" title="0.3 mm grid: slower, large file">Fine</button></div></div>
      <label class="check"><input type="checkbox" id="tLargest"> Only the largest piece</label>
      <label class="check" id="tShowRow" hidden><input type="checkbox" id="tShow" checked> Show the surface model</label>
      <div class="btns"><button class="btn pri" id="tMake" type="button" title="Make a closed surface at the threshold">Make the surface</button><button class="btn" id="tStl" type="button" title="Download the surface as an STL file, in the scan’s coordinates">Download STL</button></div>
      <div id="tOut"></div>
      <p class="tip">The STL is in the scan’s own patient coordinates (millimetres; +x the patient’s left, +y back, +z up), so it lines up with the scan in other software that uses DICOM coordinates. A model from a CBCT is limited by its voxel size and artefacts: check it before relying on it.</p>` },
    { id: 'pano', title: 'Panoramic', html: `
      <p class="lead">Tap along the middle of the arch on the axial slice, from one side to the other, or let the tool propose it. Drag a point to move it.</p>
      <div class="btns"><button class="btn pri" id="pPropose" type="button" title="Find the arch from the bright band of the teeth">Propose the arch</button><button class="btn" id="pUndo" type="button" title="Take back the last point">Undo point</button><button class="btn" id="pClear" type="button" title="Remove all the points">Start again</button></div>
      <div class="row"><label>Slab thickness</label><input type="range" id="pSlab" min="0" max="30" step="0.5" value="10"><span class="val"></span></div>
      <div class="row"><label>Slab shows</label><div class="seg" id="pMode"><button data-v="mean" type="button" title="The average across the slab, like a panoramic radiograph">Average</button><button data-v="max" type="button" title="The brightest value across the slab">Brightest</button></div></div>
      <div class="row"><label>Cross-sections</label><div class="seg" id="pCount"><button data-v="1" type="button" title="One cross-section">1</button><button data-v="3" type="button" title="Three cross-sections">3</button><button data-v="5" type="button" title="Five cross-sections">5</button></div></div>
      <div class="row"><label>Spacing</label><input type="range" id="pStep" min="0.5" max="5" step="0.5" value="2"><span class="val"></span></div>
      <div class="row"><label>Width</label><input type="range" id="pWidth" min="15" max="50" step="1" value="30"><span class="val"></span></div>
      <div id="pInfo"></div>
      <p class="tip">Tap the panoramic to put the cross-sections there; scroll over a cross-section to step along the arch. In each cross-section the cheek or lip side (B) is on the left and the tongue side (L) on the right; ticks every millimetre, numbers every 5 mm from the arch curve and the scan’s height.</p>` },
    { id: 'tooth', title: 'Pick a tooth', optional: true, html: `
      <p class="lead" id="dLead">Tap the donor tooth in a slice, near the middle of its crown.</p>
      <div class="row"><label>Outline by</label><div class="seg" id="dBy"><button data-v="rules" type="button" title="The outline is followed from the scan’s grey values by rules">Rules</button><button data-v="model" type="button" title="The outline is drawn by a trained network (ToothSeg) that runs on this device: a download of about 76 MB the first time">Model</button></div></div>
      <div id="dModel"></div>
      <div class="row"><label>Region</label><div class="seg" id="dShape"><button data-v="cyl" type="button" title="A cylinder round the tooth">Cylinder</button><button data-v="box" type="button" title="A box round the tooth">Box</button></div></div>
      <div class="row"><label>Width</label><input type="range" id="dR" min="3" max="14" step="0.25" value="7"><span class="val"></span></div>
      <div class="row"><label>Above the tap</label><input type="range" id="dUp" min="2" max="30" step="0.5" value="20"><span class="val"></span></div>
      <div class="row"><label>Below the tap</label><input type="range" id="dDown" min="2" max="30" step="0.5" value="20"><span class="val"></span></div>
      <div class="row"><label>Threshold</label><input type="range" id="dT" step="1"><span class="val"></span></div>
      <div class="row"><label>Smoothing</label><input type="range" id="dSmooth" min="0" max="0.4" step="0.05" value="0.15"><span class="val"></span></div>
      <div class="row"><label>Eraser size</label><input type="range" id="dBrush" min="0.3" max="3" step="0.1" value="1"><span class="val"></span></div>
      <div class="btns"><button class="btn" id="dFit" type="button" title="Fit the region round the tooth found">Fit the region</button><button class="btn" id="dUndo" type="button" title="Undo the last change">Undo</button><button class="btn" id="dClear" type="button" title="Pick the tooth again">Start again</button><button class="btn" id="dAlign" type="button" title="Turn the slices to run along and across this tooth’s long axis">Slices along the tooth</button></div>
      <div id="dOut"></div>
      <p class="tip">The tooth is everything at or above the threshold inside the region that is reached from your tap before it is reached from the region’s edge, taking the thickest and brightest parts first: the two meet in the dark ligament space round the root and at the narrow neck of a contact. If it leaks into the bone or the next tooth, tap there with “Not tooth”, cut the bridge with the eraser, raise the threshold, or narrow the region. Pulp spaces are filled. This works best on a scan with small voxels (0.3 mm or less, as from a small field of view): with larger voxels the ligament space may not show, and the tooth runs into the bone.</p>
      <p class="tip">“Model” gives the part of the scan round your tap (about 26 × 26 × 32 mm, as 0.2 mm voxels) to a trained network, ToothSeg, which marks the teeth in it; the one you tapped becomes the outline, and a tooth it joined to the one it bites on is parted at the bridge between them. It runs on this device — the scan is not sent anywhere — and takes about a minute, during which the rules’ outline shows. The region, width and threshold above do not apply to it; the eraser does, and “Not tooth” cuts a 1 mm ball. It was trained on CBCTs from other scanners and is not certified medical-device software: check its outline against the grey of the slices as you would any other. ${D.TOOTH_MODEL.credit}; run with ONNX Runtime Web (MIT).</p>` },
    { id: 'replica', title: 'Replica', optional: true, html: `
      <p class="lead">A printable replica of the donor tooth, to shape the socket and try it in before the tooth is moved, so it is out of the mouth for less time.</p>
      <div class="row"><label>Enlarge by</label><input type="range" id="rPdl" min="0" max="0.5" step="0.05" value="0"><span class="val"></span></div>
      <label class="check"><input type="checkbox" id="rHandle"> A handle on the crown</label>
      <div class="row" id="rHdRow"><label>Handle diameter</label><input type="range" id="rHd" min="2" max="5" step="0.5" value="3"><span class="val"></span></div>
      <div class="row" id="rHlRow"><label>Handle length</label><input type="range" id="rHl" min="4" max="14" step="1" value="8"><span class="val"></span></div>
      <div class="row"><label>Tooth (for the file name)</label><select id="rFdi" title="The tooth number, used only in the file name">${fdiOpts}</select></div>
      <div class="btns"><button class="btn pri" id="rMake" type="button" title="Make the replica as a closed, smooth surface">Make the replica</button><button class="btn" id="rStl" type="button" title="Download the replica as an STL file, in the scan’s coordinates">Download STL</button></div>
      <div id="rOut"></div>
      <p class="tip">“Enlarge by” adds the same thickness all over (0 to 0.5 mm), for example to allow for the ligament space. The replica is a planning aid made from the CBCT, not certified medical-device software: compare it with the scan and check its fit before using it, and follow your printing resin’s instructions for anything that goes in the mouth.</p>` },
    { id: 'canal', title: 'Root canals', optional: true, html: `
      <p class="lead" id="cLead"></p>
      <div class="row"><label>Canal threshold</label><input type="range" id="cT" step="1"><span class="val"></span></div>
      <div class="row"><label>Presumed course</label><div class="seg" id="cPres"><button data-v="show" type="button" title="Where a canal is not seen as far as the end of its root, its likely course on to the end is drawn in yellow">Shown</button><button data-v="hide" type="button" title="Only what the scan itself shows">Hidden</button></div></div>
      <div class="row"><label>Tooth shown as</label><div class="seg" id="cShow"><button data-v="glass" type="button" title="The tooth as clear glass round the canals">Glass</button><button data-v="hide" type="button" title="The canals on their own">Hidden</button></div></div>
      <div class="btns"><button class="btn pri" id="cFind" type="button" title="Find the pulp chamber and canals again, at the threshold worked out from this tooth">Find the canals</button><button class="btn" id="cAlign" type="button" title="Turn the slices to run along and across this tooth’s long axis">Slices along the tooth</button><button class="btn" id="cStl" type="button" title="Download the canals as an STL file, in the scan’s coordinates">Download STL</button></div>
      <div id="cOut"></div>
      <p class="tip">The canals are the hollows ringed by the tooth’s hard tissue: in each slice across the tooth, whatever lies well below the brightness of the walls round it, as far as the root end (so a wide-open apex is followed to its end). Each hollow is judged against its own walls, because on a CBCT the pulp deep in a root reads brighter than the pulp in the crown. The threshold sets where a hollow’s edge is cut: it starts half way between this tooth’s own pulp and dentine. Raise it to catch fainter canals, at the cost of specks; lower it if dentine is being taken. Check the red against the grey in the slices: “Slices along the tooth” turns them so the axial slice walks down the root.</p>
      <p class="tip">A canal narrower than the scan’s voxels only dims a voxel slightly and may not show, so a canal that is missing here is not proof that the tooth has none; canals filled with a bright root filling are not shown. This is a way of looking at the scan, not certified medical-device software.</p>` },
