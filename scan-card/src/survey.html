<script type="module">
// Survey Card — a digital dental surveyor. One arch is surveyed along a path of insertion (the analysing rod), which starts
// square to the biting surfaces and can be tilted front–back and side to side, as the model would be on a surveyor table.
//  • Survey lines (heights of contour): where the surface turns from facing the path to facing away from it, on the parts of
//    the surface that the rod can see.
//  • Undercut depth: at any point below a survey line, the horizontal distance (square to the path) from the point to a rod
//    parallel to the path that touches the height of contour — what a surveyor's undercut gauge measures. It is worked out
//    on a fine height field of the arch seen along the path: the rod's side of the solid at the point's level.
//  • Block-out: the arch filled along the path, every undercut filled (parallel block-out), as a closed solid with a flat base
//    square to the path; optionally with an even relief over it.
// All figures are measurements of the scan for planning and lab communication.
import * as N from './core.js';
import * as SOL from './solid.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
const THREE = N.THREE, $ = N.$, JAWS = ['upper', 'lower'], NAME = { upper: 'Upper', lower: 'Lower' };
const GAUGES = [0.25, 0.5, 0.75], SIDES = ['buccal', 'lingual'];                // clasp tips go on buccal or lingual surfaces
const SIDE_NAME = { buccal: 'Buccal', lingual: 'Lingual / palatal', mesial: 'Mesial', distal: 'Distal' }, SIDE_SHORT = { buccal: 'B', lingual: 'L', mesial: 'M', distal: 'D' };
const BAND = ['#ccfbf1', '#5eead4', '#0d9488', '#134e4a'], NO_UC = 0xe9dcc6, LINE = 0xc026d3;
const mm = (v) => (v === Infinity ? 'over 1.5 mm' : v.toFixed(2) + ' mm');
const P = { jaw: null, ap: 0, lat: 0, show: 'map', teeth: [], relief: 0, notation: 'fdi', bshow: 'wax', pos: 'scan', sel: -1 };
let A = null;                                                    // the survey of the chosen arch along the path (see computeSurvey)
let B = mkBlock();                                               // the blocked-out model
function mkBlock() { return { sig: null, mesh: null, info: null, obj: null }; }

const shell = N.createShell({
  name: 'Survey Card', tagline: 'Surveyor and block-out', title: document.title,
  emptyHtml: '<div><b>Load the arch to survey</b>Drop the scan here, or use the demo.</div>',
  onDropFiles: (f) => scans.loadFiles(f),
  steps: [
    { id: 'load', title: 'Load scans', html: '' },
    { id: 'orient', title: 'Check orientation', html: '' },
    { id: 'path', title: 'Path of insertion', html: `
      <div class="row" id="pJawRow"><label>Arch</label><div class="seg" id="pJaw"><button data-v="upper" type="button" title="Survey the upper arch">Upper</button><button data-v="lower" type="button" title="Survey the lower arch">Lower</button></div></div>
      <p class="lead">The rod shows the path of insertion. It starts square to the biting surfaces; tilt it to even out undercuts and guide planes.</p>
      <div class="row"><label>Front / back</label><input type="range" id="pAp" min="-30" max="30" step="0.5" value="0"><span class="val"></span></div>
      <div class="row"><label>Left / right</label><input type="range" id="pLat" min="-30" max="30" step="0.5" value="0"><span class="val"></span></div>
      <div class="btns"><button class="btn" id="pView" type="button" title="Turn the model until you look straight down the path you want, then press this">Use this view</button><button class="btn" id="pLevel" type="button" title="Back to square to the biting surfaces (no tilt)">Level</button></div>
      <div id="pInfo"></div>
      <p class="tip">Tilting works as on a surveyor table: “front up 5°” is the model with its front raised 5°, so the rod leans 5° towards the front of the arch. Left and right are the patient’s. The tilt is the record of the path (what tripod marks record on a stone model): it is kept in the case file, and a blocked-out model downloaded with its base square to the path sits on a surveyor table at this tilt. Survey lines and undercuts are worked out again when you let go of a slider.</p>` },
    { id: 'survey', title: 'Survey lines and undercuts', html: `
      <div class="row"><label>Show</label><div class="seg" id="sShow"><button data-v="map" type="button" title="Colour the undercuts by depth">Undercut map</button><button data-v="lines" type="button" title="Only the survey lines on the scan">Survey lines</button></div></div>
      <div class="bands">${BAND.map((c) => `<i style="background:${c}"></i>`).join('')}</div><div class="scale"><span>0</span><span>0.25</span><span>0.5</span><span>0.75 mm</span><span>deeper</span></div>
      <div id="sInfo"></div>
      <div class="btns"><button class="btn" id="sShot" type="button" title="Save the view as a picture">Save picture</button></div>
      <p class="tip">The magenta line is the survey line (height of contour) for this path: above it the surface faces the rod, below it the surface turns away. Undercut depth is the horizontal distance — square to the path — from a point to a rod parallel to the path that touches the height of contour, as an undercut gauge measures it. The bands are the 0.25, 0.5 and 0.75 mm gauges. Tap the scan to read the undercut at a point and how far it lies below the survey line. Areas hidden under a bulge but facing the rod (the gum under a tooth’s widest part) are coloured too: they are filled by the block-out but are not surfaces a clasp can use. The scan’s accuracy limits what can be told apart: a few hundredths of a millimetre is within its noise.</p>` },
    { id: 'teeth', title: 'Abutment teeth', html: `
      <p class="lead">Tap each tooth you plan to clasp. Its undercuts are listed by side, with how far below the survey line each gauge first touches.</p>
      <div class="row"><label>Tooth numbers</label><div class="seg" id="tNot"><button data-v="fdi" type="button" title="Two-digit FDI numbers (36, 44 …)">FDI</button><button data-v="palmer" type="button" title="Palmer quadrants (LL6, LR4 …)">Palmer</button></div></div>
      <div id="tList"></div>
      <pre class="out" id="tOut" hidden></pre>
      <div class="btns"><button class="btn" id="tCopy" type="button" title="Copy the summary as text">Copy summary</button><button class="btn" id="tClear" type="button" title="Remove all the abutment teeth">Clear teeth</button></div>
      <p class="tip">The tooth number is a guess from where the tooth sits in the arch — correct it in the list if needed. The tooth is found from the shape of the crowns round your tap; the side of each surface is worked out from the arch (buccal faces away from its centre, mesial towards the midline). For each side the table gives the deepest undercut on the surfaces facing away from the path, and for each gauge the height below the survey line at which it first touches (“–”: that gauge does not touch on that side). The dots on the model mark those points. “Clasp tip” leaves that much undercut on one side of the tooth when the model is blocked out, so a clasp designed on the blocked-out model can reach into it; everything else is still filled.</p>` },
    { id: 'block', title: 'Block-out', html: `
      <p class="lead">Every undercut is filled parallel to the path, so a framework designed on this model goes on and comes off along it.</p>
      <div class="row"><label>Relief</label><input type="range" id="bRelief" min="0" max="0.5" step="0.05" value="0"><span class="val"></span></div>
      <div class="row"><label>Show</label><div class="seg" id="bShow"><button data-v="wax" type="button" title="The scan with the block-out wax in blue">Wax on the scan</button><button data-v="model" type="button" title="The blocked-out model on its own">Model</button></div></div>
      <div id="bInfo"></div>
      <div class="row"><label>Position</label><div class="seg" id="bPos"><button data-v="scan" type="button" title="Exactly where the scanner put the scan, so the model lines up with it in other software">As scanned</button><button data-v="path" type="button" title="Base down at Z = 0, square to the path: on a flat surveyor table the model sits at this path">Base square to the path</button></div></div>
      <div class="btns"><button class="btn pri" id="bStl" type="button" title="Download the blocked-out model as STL">Download STL</button><button class="btn" id="bCase" type="button" title="Save the scans, the path and the blocked-out model as one case file">Save case</button></div>
      <p class="note">A design aid for planning partial dentures and talking to the lab. Check the blocked-out model against the scan and the patient before relying on it.</p>
      <p class="tip">The blocked-out model is a closed solid with a flat base square to the path, 3 mm below the lowest point of the scan, on a 0.15 mm grid. Above the survey lines it follows the scan (to within about 0.07 mm where the surface turns vertical just above the line); below them it drops straight along the path. “Relief” adds an even layer over the blocked-out model (a spacer), in millimetres. With a clasp tip set on the Abutment teeth step, that side of the tooth keeps its undercut up to the chosen gauge and is blocked out deeper than that; relief is not added there.</p>` },
  ],
});
const viewer = N.createViewer(shell.view);
N.addViewButtons(shell, viewer);
const legend = shell.panel('', 'legend'); legend.hidden = true;
const scans = N.createScanSet({
  shell, viewer, appName: 'Survey Card', loadStep: 'load', orientStep: 'orient',
  onChange: (what) => { if (what === 'visibility' || what === 'case') return; dropSurvey(); syncUI(); refreshView(); },
  extendCase: (c) => {
    c.remove('survey-blockout');
    const sc = P.jaw && scans[P.jaw];
    if (sc && B.mesh && B.sig === blockSig()) c.add({ role: 'survey-blockout', name: `blockout-${P.jaw}`, mesh: N.transformMesh(B.mesh, sc.matrix.clone().invert()), matrix: sc.matrix, meta: { jaw: P.jaw, sig: B.sig, info: B.info } });
    c.data.survey = { version: 1, jaw: P.jaw, tilt: { ap: P.ap, lat: P.lat }, dir: P.jaw ? pathDir().toArray() : null, relief: P.relief, notation: P.notation, teeth: P.teeth.map((t) => ({ fdi: t.fdi, at: t.at, keep: t.keep, side: t.side })), summary: A ? summaryData() : null };
  },
  readCase: (c) => {
    dropSurvey(); const d = c.data.survey;
    if (d) { P.jaw = d.jaw || P.jaw; P.ap = d.tilt ? +d.tilt.ap || 0 : 0; P.lat = d.tilt ? +d.tilt.lat || 0 : 0; P.relief = d.relief || 0; P.notation = d.notation || 'fdi'; P.teeth = (d.teeth || []).map((t) => ({ fdi: t.fdi, at: t.at, keep: t.keep || 0, side: t.side || 'buccal' })); }
    paramsToUI();
    const it = c.get('survey-blockout');
    if (it && it.mesh && pickJaw() && it.meta && it.meta.jaw === P.jaw && it.meta.sig === blockSig()) { B.sig = it.meta.sig; B.mesh = N.transformMesh(it.mesh, it.matrix); B.info = it.meta.info || null; }
    if (pickJaw()) survey();
    syncUI(); refreshView();
  },
});
function pickJaw() { if (P.jaw && scans.has(P.jaw)) return P.jaw; P.jaw = scans.has('lower') && !scans.has('upper') ? 'lower' : scans.has('upper') && !scans.has('lower') ? 'upper' : scans.has('lower') ? 'lower' : null; return P.jaw; }

// ───────────── the path ─────────────
/** Out of the teeth along the path (case frame): the occlusal axis tilted by the two table angles (in their own planes). */
function dirOf(jaw, ap, lat) { const r = Math.PI / 180; return new THREE.Vector3(Math.tan(lat * r), -Math.tan(ap * r), jaw === 'upper' ? -1 : 1).normalize(); }
const pathDir = () => dirOf(P.jaw, P.ap, P.lat);
/** case frame → "path frame": the path along +Z, the arch's own x roughly kept (an upper arch is turned over first) */
function frameOf(d, jaw) {
  const F = jaw === 'upper' ? N.rotationAbout('y', 180) : new THREE.Matrix4(), fd = d.clone().transformDirection(F);
  return new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(fd, new THREE.Vector3(0, 0, 1))).multiply(F);
}
const tiltText = (ap, lat) => { const a = Math.abs(ap) < 0.05 ? 'front / back level' : `${ap > 0 ? 'front' : 'back'} up ${Math.abs(ap).toFixed(1)}°`, b = Math.abs(lat) < 0.05 ? 'left / right level' : `patient’s ${lat > 0 ? 'left' : 'right'} up ${Math.abs(lat).toFixed(1)}°`; return `${a}, ${b}`; };

// ───────────── the survey (pure: any mesh in the case frame) ─────────────
const OFFS = new Map();
function offsets(R) {
  let o = OFFS.get(R); if (o) return o; const L = [];
  for (let dj = -R; dj <= R; dj++) for (let di = -R; di <= R; di++) { const r = Math.hypot(di, dj); if (r <= R + 0.5) L.push([di, dj, r]); }
  L.sort((a, b) => a[2] - b[2]); o = { di: Int16Array.from(L, (x) => x[0]), dj: Int16Array.from(L, (x) => x[1]), r: Float32Array.from(L, (x) => x[2]), n: L.length }; OFFS.set(R, o); return o;
}
/**
 * Survey a mesh (case frame) along d (unit, out of the teeth).
 *   o.jaw   'upper' | 'lower' (only sets how the path frame is turned)   o.cell (0.05) height-field spacing, mm   o.maxDepth (1.5)
 * → { Q (case → path frame), Pd (positions in the path frame), hf (max height field along the path), s (vertex normal · d),
 *     depth (undercut depth per vertex, mm; 0 where the rod sees the point; Infinity beyond maxDepth), seg (survey line segments,
 *     case frame, xyz pairs), segD (the same in the path frame), search(x, y, h, out), heightBelow(x, y, h), time }
 */
function computeSurvey(mesh, d, o = {}) {
  const t0 = performance.now(), cell = o.cell || 0.05, maxD = o.maxDepth ?? 1.5, tau = 0.02, minU = o.minUndercut ?? 0.1;
  const Q = frameOf(d, o.jaw), e = Q.elements, Pc = mesh.positions, I = mesh.indices, nV = Pc.length / 3, nF = I.length / 3, Pd = new Float32Array(Pc.length);
  for (let i = 0; i < Pc.length; i += 3) { const x = Pc[i], y = Pc[i + 1], z = Pc[i + 2]; Pd[i] = e[0] * x + e[4] * y + e[8] * z; Pd[i + 1] = e[1] * x + e[5] * y + e[9] * z; Pd[i + 2] = e[2] * x + e[6] * y + e[10] * z; }
  const md = { positions: Pd, indices: I }, hf = N.rasterHeightfield(md, { cell, mode: 'max', pad: maxD + 1 }), { nx, ny, x0, y0 } = hf, H = hf.z, inv = 1 / cell;
  // which way the triangles face (+1 out of the tissue, as scanners write them): judged on the top 2.5 mm, as Compare and Prep check do
  let zt = -Infinity; for (let i = 2; i < Pd.length; i += 3) if (Pd[i] > zt) zt = Pd[i];
  let sz = 0; for (let f = 0; f < nF; f++) { const a = I[3 * f] * 3, b = I[3 * f + 1] * 3, c = I[3 * f + 2] * 3; if ((Pd[a + 2] + Pd[b + 2] + Pd[c + 2]) / 3 < zt - 2.5) continue; sz += (Pd[b] - Pd[a]) * (Pd[c + 1] - Pd[a + 1]) - (Pd[b + 1] - Pd[a + 1]) * (Pd[c] - Pd[a]); }
  const flip = sz < 0 ? -1 : 1, Nv = N.vertexNormals(md), s = new Float32Array(nV);
  for (let v = 0; v < nV; v++) { Nv[3 * v] *= flip; Nv[3 * v + 1] *= flip; Nv[3 * v + 2] *= flip; s[v] = Nv[3 * v + 2]; }
  // undercut depth: the nearest column, at the point's own level, whose top is below that level (the rod's side of the solid)
  const O = offsets(Math.ceil(maxD * inv) + 2);
  const search = (x, y, h, out) => {
    const fx = (x - x0) * inv, fy = (y - y0) * inv, i0 = Math.round(fx), j0 = Math.round(fy), lim = h + tau;
    if (i0 >= 0 && j0 >= 0 && i0 < nx && j0 < ny && !(H[j0 * nx + i0] >= lim)) { if (out) { out.wx = x; out.wy = y; } return 0; }
    let best = Infinity, bx = fx, by = fy;
    for (let k = 0; k < O.n; k++) {
      if (O.r[k] - 1.42 > best) break;
      const i = i0 + O.di[k], j = j0 + O.dj[k];
      if (i >= 0 && j >= 0 && i < nx && j < ny && H[j * nx + i] >= lim) continue;
      const cx = Math.min(Math.max(fx, i - 0.5), i + 0.5), cy = Math.min(Math.max(fy, j - 0.5), j + 0.5), dd = Math.hypot(fx - cx, fy - cy);   // to the edge of that column's cell
      if (dd < best) { best = dd; bx = cx; by = cy; }
    }
    if (out) { out.wx = x0 + bx * cell; out.wy = y0 + by * cell; }
    return best === Infinity || best * cell > maxD ? Infinity : best * cell;
  };
  const depth = new Float32Array(nV); let shadowed = 0;
  for (let v = 0; v < nV; v++) { const dd = search(Pd[3 * v], Pd[3 * v + 1], Pd[3 * v + 2]); depth[v] = dd; if (dd > 0.02) shadowed++; }
  // survey lines: where the vertex normal turns past square to the path, between a point the rod sees and a patch of surface
  // facing away from it that holds a real undercut (≥ minU) — so fissures and scan noise do not draw lines
  const par = new Int32Array(nV); for (let v = 0; v < nV; v++) par[v] = v;
  const find = (v) => { while (par[v] !== v) { par[v] = par[par[v]]; v = par[v]; } return v; };
  for (let f = 0; f < nF; f++) for (let k = 0; k < 3; k++) { const a = I[3 * f + k], b = I[3 * f + (k + 1) % 3]; if (s[a] < 0 && s[b] < 0) { const ra = find(a), rb = find(b); if (ra !== rb) par[ra] = rb; } }
  const cmax = new Float32Array(nV); for (let v = 0; v < nV; v++) if (s[v] < 0) { const r = find(v); if (depth[v] > cmax[r]) cmax[r] = depth[v]; }
  const kept = (v) => s[v] < 0 && cmax[find(v)] >= minU, seen = (v) => s[v] >= 0 && depth[v] <= 0.05;
  const seg = [], segD = [], cross = (a, b, out, outD) => { const t = s[a] / (s[a] - s[b]); for (let k = 0; k < 3; k++) { out.push(Pc[3 * a + k] + t * (Pc[3 * b + k] - Pc[3 * a + k])); outD.push(Pd[3 * a + k] + t * (Pd[3 * b + k] - Pd[3 * a + k])); } };
  for (let f = 0; f < nF; f++) {
    const a = I[3 * f], b = I[3 * f + 1], c = I[3 * f + 2];
    if ((s[a] < 0) === (s[b] < 0) && (s[b] < 0) === (s[c] < 0)) continue;
    if (!(kept(a) || kept(b) || kept(c)) || !(seen(a) || seen(b) || seen(c))) continue;
    const p = [], pd = [];
    if ((s[a] < 0) !== (s[b] < 0)) cross(a, b, p, pd); if ((s[b] < 0) !== (s[c] < 0)) cross(b, c, p, pd); if ((s[c] < 0) !== (s[a] < 0)) cross(c, a, p, pd);
    if (p.length === 6) { seg.push(...p); segD.push(...pd); }
  }
  // The survey line segments, by where they lie seen along the path. Below a survey line the rod's side of the solid is the line
  // carried straight down, so the depth is refined to the distance (seen along the path) from the point to the nearest segment
  // that stands above it, near the wall the height field found — the line is exact to the mesh, the height field to a cell.
  const HC = 0.25, hash = new Map(), nS = segD.length / 6;
  for (let k = 0; k < nS; k++) { const o = 6 * k, ax = Math.floor(Math.min(segD[o], segD[o + 3]) / HC), bx = Math.floor(Math.max(segD[o], segD[o + 3]) / HC), ay = Math.floor(Math.min(segD[o + 1], segD[o + 4]) / HC), by = Math.floor(Math.max(segD[o + 1], segD[o + 4]) / HC); for (let gx = ax; gx <= bx; gx++) for (let gy = ay; gy <= by; gy++) { const key = gx * 100003 + gy; let l = hash.get(key); if (!l) hash.set(key, (l = [])); l.push(k); } }
  /** the nearest survey segment above level h, looked for within r of (wx, wy), measured from (x, y) → { d, hc } ; also whether one lies below h there */
  const lineNear = (x, y, h, wx, wy, r) => {
