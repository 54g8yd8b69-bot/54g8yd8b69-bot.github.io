 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}}

<body>
<script type="module">
// Articulator Card — an average-value / semi-adjustable virtual articulator.
//  • The upper and lower arches are mounted in the bite they were scanned in (or as Scan Card has them: scans or models with
//    base). The hinge axis comes from average values: the Bonwill triangle (condyle – condyle – lower incisal point) tilted up
//    from the biting plane by the Balkwill angle. Defaults are those Splint Card uses for its hinge opening (101.6 mm, 26°), so a
//    splint designed there with a hinge opening seats here on the same arc.
//  • The lower jaw is one rigid body. Its two condyles run down straight condylar paths (sagittal condylar guidance; on the
//    non-working side also inwards by the Bennett angle, after an immediate side shift; the working condyle only shifts outwards
//    by what keeps the two the same distance apart). That leaves one freedom: turning about the line through the two condyles.
//    It is settled by contact — the jaw closes about that line until the teeth (or an appliance) first touch — so the front and
//    canine guidance come from the surfaces themselves (an incisal table can be added).
//  • At every position: a contact map (distance to the opposing surface), the contacts by region and side (working / non-working),
//    the guidance (canine guidance, group function, …), the paths of the incisal point and the lower canine tips, and the opening.
//  • Either arch can be replaced (or covered) by an appliance: the splint from the Splint tab, the wax-up from the Shells tab, or an
//    STL in the scan's own coordinates (a wax-up, a model, a splint from elsewhere).
// Collision: three-mesh-bvh triangle–triangle intersection between the two surfaces (each with its own search tree), bisected on
// the hinge angle to 0.002 mm at the incisal point; the open end is kept, so the surfaces never cross. Distances for the contact
// map: closest point on the other surface for every vertex within 0.5 mm.
// Nothing here is a recorded movement of the patient: see MOVES below for where a jaw-tracker recording would go.
import * as N from './core.js';
const THREE = N.THREE, $ = N.$, V3 = THREE.Vector3, M4 = THREE.Matrix4, D2R = Math.PI / 180, JAWS = ['upper', 'lower'], NAME = { upper: 'Upper', lower: 'Lower' };
const STEP = 0.5, CONTACT = 0.1, NEAR = 0.5;                     // mm: spacing of the worked-out positions; "in contact" under 0.1 mm; "near" up to 0.5 mm
const DEF = () => ({ icw: 101.6, side: 101.6, balk: 26, sci: [30, 30], ben: [15, 15], iss: [0, 0], apart: false, guide: 'teeth', table: 0, tol: 0, travel: 8,
  pts: {},                                                        // points moved by hand (case frame): inc, lcL, lcR, ucL, ucR
  src: { upper: 'scan', lower: 'scan' }, keep: { upper: true, lower: true } });   // [left, right] for sci / ben / iss
const P = DEF();
const A = { upper: null, lower: null };                           // an STL loaded in place of an arch: { mesh (in the scan's own file coordinates), name, sig }
// What else can stand in for an arch: work from the other tools, found in the case (or asked of Scan Card). keep: the default for
// "keep the scan's teeth too" — a splint sits on the teeth; a wax-up or the scan before preparation replaces the arch.
const OFFER = {
  splint: { role: 'splint', key: 'splint', keep: true, label: () => 'Splint', what: () => 'the splint from the Splint tab' },
  shell: { role: 'shell-shape', key: 'shell', keep: false, label: (m) => (m === 'matrix' ? 'Wax-up' : 'Pre-op'), what: (m) => (m === 'matrix' ? 'the wax-up from the Shells tab' : 'the scan before preparation from the Shells tab') },
};
const CA = { splint: null, shell: null };                         // { jaw, mesh (case frame), sig, label, what }
// Models with base from Scan Card's Models tab may carry its bite hinge: two ball-and-socket posts just behind the arches, which would
// lock the jaws together here. Model Card (planHinge) stands them 5 mm behind the furthest-back scan, radius 3.2 mm, with a tab out to
// their back: so the model reaches 8.2 mm past the scans. Everything more than HINGE_CUT mm in front of a hinged model's back is kept.
const HINGE_CUT = 7.4, HINGED = { upper: false, lower: false };
let E = null;                                                     // the mounted engine
const S = { move: 'prot', p: 0, theta: 0, an: null, playing: false, show: { upper: true, lower: true, rig: true, paths: true, map: true }, pick: null, view: 'both', lastStep: '' };

// ───────────── kinematics (pure functions; the case frame: +X patient's left, +Y back, +Z up) ─────────────
const K = {};
/** the most occlusal point near the midline, in the front half: the lower incisal point (dir +1) or the upper incisal edge (dir −1) */
K.frontPoint = (mesh, dir = 1) => {
  const Q = mesh.positions, n = Q.length / 3; let yc = 0; for (let i = 1; i < Q.length; i += 3) yc += Q[i]; yc /= n || 1;
  for (const w of [3, 8, 25]) {                                    // widen the search if nothing is that close to the midline (missing incisors)
    let best = -1, zt = -Infinity; for (let i = 0; i < Q.length; i += 3) if (Math.abs(Q[i]) < w && Q[i + 1] < yc && dir * Q[i + 2] > zt) { zt = dir * Q[i + 2]; best = i; }
    if (best >= 0) return new V3(0, Q[best + 1], Q[best + 2]);
  }
  return new V3(0, yc, 0);
};
/** a canine tip: the most occlusal point at the canine's usual distance round the arch from the front point (to be checked by eye) */
K.canineTip = (mesh, dir, front, sideSign) => {
  const Q = mesh.positions, lo = dir > 0 ? 12 : 15, hi = dir > 0 ? 17 : 20.5; let best = null, bz = -Infinity;
  for (let i = 0; i < Q.length; i += 3) { const x = Q[i] - front.x; if (x * sideSign < 6) continue; const d = Math.hypot(x, Q[i + 1] - front.y); if (d < lo || d > hi || Q[i + 1] > front.y + 16) continue; if (dir * Q[i + 2] > bz) { bz = dir * Q[i + 2]; best = i; } }
  return best === null ? new V3(front.x + sideSign * 15, front.y + 8, front.z) : new V3(Q[best], Q[best + 1], Q[best + 2]);
};
/** the articulator: condyles from the incisal point, the Bonwill triangle (side, intercondylar width) and the Balkwill angle */
K.frame = (inc, p) => {
  const d = Math.sqrt(Math.max(1, p.side * p.side - p.icw * p.icw / 4)), b = p.balk * D2R, y = inc.y + d * Math.cos(b), z = inc.z + d * Math.sin(b);
  return { inc: inc.clone(), L: new V3(inc.x + p.icw / 2, y, z), R: new V3(inc.x - p.icw / 2, y, z), W: p.icw, rInc: d };
};
/** how far along the path the immediate side shift is taken up (mm of condylar travel) */
K.ISS_OVER = 0.5;
/** the unit direction of a condylar path: forward, down by the sagittal angle, inwards by the Bennett angle (both as seen in projection) */
K.pathDir = (sciDeg, benDeg, inward) => new V3(inward * Math.tan(benDeg * D2R), -1, -Math.tan(sciDeg * D2R)).normalize();
/**
 * Where the two condyles are after `t` mm of travel along the path. move: 'prot' | 'right' | 'left' | 'back' | 'open'.
 * In a side movement the non-working condyle runs forward, down and inwards (after the immediate side shift); the working condyle
 * stays at its height and depth and shifts outwards by whatever keeps the two the fixed distance apart (the Bennett movement).
 */
K.condyles = (F, p, move, t) => {
  const L = F.L.clone(), R = F.R.clone(), W = F.W;
  if (move === 'prot') { L.addScaledVector(K.pathDir(p.sci[0], 0, 0), t); R.addScaledVector(K.pathDir(p.sci[1], 0, 0), t); }
  else if (move === 'back') { L.y += t; R.y += t; }
  else if (move === 'right' || move === 'left') {
    const orb = move === 'right' ? L : R, k = move === 'right' ? 0 : 1, inward = move === 'right' ? -1 : 1;
    orb.addScaledVector(K.pathDir(p.sci[k], p.ben[k], inward), t); orb.x += inward * p.iss[k] * Math.min(1, t / K.ISS_OVER);
  }
  const dy = L.y - R.y, dz = L.z - R.z, sx = Math.sqrt(Math.max(0, W * W - dy * dy - dz * dz));
  if (move === 'right') R.x = L.x - sx; else if (move === 'left') L.x = R.x + sx; else { const c = (L.x + R.x) / 2; L.x = c + sx / 2; R.x = c - sx / 2; }
  return { L, R };
};
/** the lower jaw's movement (4×4, case frame) with its condyles at C and turned `theta` about the line through them (+ opens) */
K.pose = (F, C, theta, out = new M4()) => {
  const e0 = F.L.clone().sub(F.R).normalize(), e1 = C.L.clone().sub(C.R).normalize(), q = new THREE.Quaternion().setFromUnitVectors(e0, e1);
  const m0 = F.L.clone().add(F.R).multiplyScalar(0.5), m1 = C.L.clone().add(C.R).multiplyScalar(0.5);
  const hinge = new THREE.Quaternion().setFromAxisAngle(e1, theta).multiply(q);
  return out.compose(m1.clone().sub(m0.clone().applyQuaternion(hinge)), hinge, new V3(1, 1, 1));
};
/** the hinge angle at which the incisal point rides on an incisal table sloping down by `deg` away from its start (0 = flat) */
K.tableTheta = (F, C, deg) => {
  const tn = Math.tan(deg * D2R), v = new V3(), m = new M4(), g = (th) => { v.copy(F.inc).applyMatrix4(K.pose(F, C, th, m)); return v.z - (F.inc.z - Math.hypot(v.x - F.inc.x, v.y - F.inc.y) * tn); };
  let lo = -0.35, hi = 0.9; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (g(mid) > 0) lo = mid; else hi = mid; } return (lo + hi) / 2;
};
/** which part of the arch a point lies in, from that arch's front point and canine tips */
K.region = (lm, p) => {
  const c = p.x > lm.inc.x ? lm.cL : lm.cR, dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy); if (d <= 3.8) return 'canine';
  return dx * (c.x - lm.inc.x) + dy * (c.y - lm.inc.y) < 0 ? 'incisor' : d <= 18.5 ? 'premolar' : 'molar';
};

// ───────────── the movements ─────────────
// A movement gives the lower jaw's position for a slider value. The built-in ones come from the condylar paths plus contact.
// RECORDED JAW MOTION (not built yet) belongs here: a jaw-tracker export (e.g. what exocad's Jaw Motion Import reads), once turned
// into a list of 4×4 matrices of the lower jaw relative to the mounted bite (case frame), becomes one more entry with its own
// `pose(p)` and `solve: false` — setRecorded() below already plays such a list and maps its contacts. What is missing is reading
// the trackers' file formats and lining their coordinates up with the scans.
const MOVES = {
  prot: { label: 'Forward', name: 'Protrusion', max: () => P.travel, solve: true },
  right: { label: 'Right', name: 'Right side movement', max: () => P.travel, solve: true, work: 'R' },
  left: { label: 'Left', name: 'Left side movement', max: () => P.travel, solve: true, work: 'L' },
  back: { label: 'Back', name: 'Retrusion', max: () => 2, solve: true },
  open: { label: 'Open', name: 'Hinge opening', max: () => 25, solve: false },
};
function setRecorded(frames) {                                     // frames: arrays of 16 numbers (column-major, as THREE.Matrix4.toArray)
  if (!frames || frames.length < 2) { delete MOVES.rec; syncUI(); return; }
  const ms = frames.map((f) => { const m = new M4().fromArray(f), t = new V3(), q = new THREE.Quaternion(), s = new V3(); m.decompose(t, q, s); return { t, q }; });
  MOVES.rec = { label: 'Recorded', name: 'Recorded movement', max: () => ms.length - 1, solve: false, frameStep: 1,
    pose: (p) => { const i = N.clamp(Math.floor(p), 0, ms.length - 2), f = N.clamp(p - i, 0, 1); return new M4().compose(ms[i].t.clone().lerp(ms[i + 1].t, f), ms[i].q.clone().slerp(ms[i + 1].q, f), new V3(1, 1, 1)); } };
  if (E) delete E.res.rec; syncUI();
}

// ───────────── shell ─────────────
const srcButtons = (j) => `<button data-v="scan" type="button" title="Use the ${j} arch as loaded">The scan</button>${Object.keys(OFFER).map((k) => `<button data-v="${k}" type="button" hidden></button>`).join('')}<button data-v="file" type="button" title="Use an STL in the same position as this scan: a wax-up, a model or an appliance">STL…</button>`;
const shell = N.createShell({
  name: 'Articulator Card', tagline: 'Virtual articulator', title: document.title,
  emptyHtml: '<div><b>Load the upper and lower scans</b>Drop them here, or use the demo.</div>',
  onDropFiles: (f) => scans.loadFiles(f),
  steps: [
    { id: 'load', title: 'Load scans', html: '' },
    { id: 'orient', title: 'Check orientation', html: '' },
    { id: 'mount', title: 'Mount', html: `
      <p class="lead">The arches are mounted in the bite they were scanned in, on an average-value hinge axis.</p>
      <div id="mtWarn"></div><div class="offerBox" id="mtOffer"></div>
      ${JAWS.map((j) => `<div class="mnt" data-jaw="${j}"><b>${NAME[j]} arch</b><div class="seg" data-src="${j}">${srcButtons(j)}</div><label class="check" data-keep="${j}" hidden><input type="checkbox" checked> Keep the scan’s teeth too (it sits on them, or covers only part of the arch)</label><small data-info="${j}"></small></div>`).join('')}
      <input type="file" id="apIn" accept=".stl,.ply,.obj" hidden>
      <div class="h4">Points</div>
      <p>Check the five dots: the lower incisal point (I) and the four canine tips. To move one, choose it and tap the right place.</p>
      <div class="seg" id="ptSeg"><button data-v="inc" type="button" title="Lower incisal point: between the lower central incisors, at their edge">Incisal</button><button data-v="ucR" type="button" title="Upper right canine tip">UR3</button><button data-v="ucL" type="button" title="Upper left canine tip">UL3</button><button data-v="lcR" type="button" title="Lower right canine tip">LR3</button><button data-v="lcL" type="button" title="Lower left canine tip">LL3</button></div>
      <div class="btns"><button class="btn" id="ptAuto" type="button" title="Find the five points again from the scans">Find them again</button></div>
      <div class="h4">Hinge axis (average values)</div>
      <div class="row"><label>Between the condyles</label><input type="range" id="aIcw" min="90" max="120" step="0.1" value="101.6"><span class="val wide"></span></div>
      <div class="row"><label>Condyle to incisal point</label><input type="range" id="aSide" min="90" max="120" step="0.1" value="101.6"><span class="val wide"></span></div>
      <div class="row"><label>Balkwill angle</label><input type="range" id="aBalk" min="15" max="35" step="1" value="26"><span class="val"></span></div>
      <p class="tip">The condyles are placed from the lower incisal point: the two condyles and that point make the Bonwill triangle, tilted up from the biting plane (as levelled on the Scans tab) by the Balkwill angle. The starting values are the classical averages Splint Card uses for its hinge opening (see the Sources there), so a splint made with a hinge opening seats here on the same arc. They are not this patient’s hinge axis — there is no facebow here.</p>
      <p class="tip">UR3, UL3, LR3 and LL3 are the canine tips: they decide which contacts are called canine, front or back teeth, and the lower ones’ paths are drawn.</p>
      <p class="tip">“STL…” takes a file in the same coordinates as the scan it replaces — a wax-up or a splint exported from other software alongside the scan. Work from the other tabs (a splint, a wax-up) is already in place. An appliance that sits on the teeth can keep the scan under it, so teeth it does not cover still count.</p>` },
    { id: 'set', title: 'Settings', html: `
      <p class="lead">Average values to start from. Change them if you have the patient’s own.</p>
      <label class="check"><input type="checkbox" id="sApart"> Set left and right separately</label>
      <div class="row"><label id="sCiL">Condylar guidance</label><input type="range" id="sCi0" min="0" max="60" step="1" value="30"><span class="val"></span></div>
      <div class="row rt"><label>Condylar guidance, right</label><input type="range" id="sCi1" min="0" max="60" step="1" value="30"><span class="val"></span></div>
      <div class="row"><label id="sBnL">Bennett angle</label><input type="range" id="sBn0" min="0" max="30" step="1" value="15"><span class="val"></span></div>
      <div class="row rt"><label>Bennett angle, right</label><input type="range" id="sBn1" min="0" max="30" step="1" value="15"><span class="val"></span></div>
      <div class="row"><label id="sIsL">Immediate side shift</label><input type="range" id="sIs0" min="0" max="1.5" step="0.1" value="0"><span class="val"></span></div>
      <div class="row rt"><label>Immediate side shift, right</label><input type="range" id="sIs1" min="0" max="1.5" step="0.1" value="0"><span class="val"></span></div>
      <div class="row"><label>Front guidance</label><div class="seg" id="sGuide"><button data-v="teeth" type="button" title="The jaw closes until the teeth (or the appliance) touch: the guidance is theirs">The teeth</button><button data-v="table" type="button" title="An incisal table as well: the jaw rests on the table or the teeth, whichever holds it further open">Incisal table</button></div></div>
      <div class="row" id="sTableRow"><label>Table angle (0 = flat)</label><input type="range" id="sTable" min="0" max="60" step="1" value="0"><span class="val"></span></div>
      <div class="row"><label>How far to move</label><input type="range" id="sTravel" min="3" max="12" step="1" value="8"><span class="val"></span></div>
      <div class="row"><label>Overlap allowed</label><input type="range" id="sTol" min="0" max="0.3" step="0.01" value="0"><span class="val"></span></div>
      <p class="tip">Condylar guidance is the slope of each condyle’s path below the biting plane as levelled on the Scans tab. The Bennett angle (seen from above) and the immediate side shift apply to the condyle on the non-working side; that side’s values are used (left values for a movement to the right). The paths are straight lines; the dashed lines at the condyles show them.</p>
      <p class="tip">“Overlap allowed” lets the surfaces pass into each other by that much before they count as touching — for scans whose bite overlaps a little. “How far to move” is the travel of the condyle along its path. The incisal table slopes down at its angle in every direction from where the incisal point starts.</p>` },
    { id: 'move', title: 'Movements', html: `
      <div class="offerBox" id="mvOffer"></div>
      <div class="seg" id="mvSeg"></div>
      <div id="playRow"><button class="btn" id="mvPlay" type="button" title="Play the movement out and back">Play</button><input type="range" id="mvP" min="0" max="8" step="0.05" value="0" aria-label="Position"><span class="val" id="mvVal"></span></div>
      <div class="row"><label>View</label><div class="seg" id="mvView"><button data-v="both" type="button" title="Both arches from the front">Both</button><button data-v="lower" type="button" title="The lower arch from above, the upper hidden: its contacts">Lower</button><button data-v="upper" type="button" title="The upper arch from below, the lower hidden: its contacts">Upper</button></div></div>
      <div id="mvVerdict"></div>
      <div class="read" id="mvRead"></div>
      <div id="mvContacts"></div>
      <div id="mvChart"></div>
      <div class="btns"><button class="btn" id="mvStl" type="button" title="Download the lower arch as an STL in this position">Download lower arch here</button><button class="btn" id="mvRec" type="button" disabled title="Playing back a jaw-tracker recording is not built yet">Recorded jaw motion: not yet</button></div>
      <p class="tip">Drag the slider or press Play. At each position the lower jaw has closed about the line through its condyles until something touches. Red is contact (under ${CONTACT} mm), orange to yellow is near (up to ${NEAR} mm). “Working side” is the side the jaw moves towards. “Lower” and “Upper” show one arch on its own so its contacts can be seen.</p>
      <p class="tip">Canine guidance: on the working side only the canine touches while the jaw moves from 1 to 4 mm. Group function: the canine and back teeth of the working side share it. A contact of back teeth on the other side (from 1 mm on) is flagged as a non-working-side contact. This is a rigid, average-value model: a planning aid, not a record of how this patient moves.</p>` },
    { id: 'report', title: 'Summary', html: `
      <p class="lead">Forward and both side movements, worked out with the settings as they are.</p>
      <div id="rOut"></div>
      <div class="btns"><button class="btn pri" id="rCopy" type="button" title="Copy the summary as text">Copy the summary</button><button class="btn" id="rCase" type="button" title="Save the scans and these settings as one case file">Save case</button></div>
      <p class="tip">A design aid, not a certified medical device. The hinge axis and the condylar settings are averages unless you set the patient’s own; check anything that matters in the mouth.</p>` },
  ],
});
const viewer = N.createViewer(shell.view);
N.addViewButtons(shell, viewer);
const legend = shell.panel(`<div><i style="background:#ef4444"></i>Contact (under ${CONTACT} mm)</div><div><i style="background:linear-gradient(90deg,#fb923c,#fde047)"></i>Near (${CONTACT}–${NEAR} mm)</div>`, 'legend'); legend.hidden = true;
const scans = N.createScanSet({
  shell, viewer, appName: 'Articulator Card', loadStep: 'load', orientStep: 'orient',
  onChange: (what) => { if (what === 'visibility') return; if (what !== 'case') { HINGED.upper = HINGED.lower = false; for (const j of JAWS) if (!scans.has(j)) { A[j] = null; P.src[j] = 'scan'; } } stale(); syncUI(); if (MY()) enter(); else refreshView(); },
