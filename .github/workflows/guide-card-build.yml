name: Build Guide Card
# Rebuilds guide-card/index.html whenever the catalogue data or app source changes, and commits it.
# So you can edit guide-card/data/guide-card.json on GitHub and the live app updates by itself.
on:
  push:
    branches: [main]
    paths: ['guide-card/data/guide-card.json', 'guide-card/src/**', 'guide-card/tools/build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the data and build
        run: python3 guide-card/tools/build.py
      - name: Commit the rebuilt app
        run: |
          if git diff --quiet guide-card/index.html; then echo "index.html already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide-card/index.html
          git commit -m "Rebuild Guide Card from data"
          git push
