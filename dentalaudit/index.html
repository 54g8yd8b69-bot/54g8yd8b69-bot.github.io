<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- Same-origin only. connect-src allows the optional AI assistant to reach a backend on this computer (off by default); nothing else leaves the page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http://localhost:8787 http://127.0.0.1:8787; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DentalAudit</title>
  <meta name="description" content="Plan, collect, analyse and report dental clinical audits, re-audits and quality improvement projects.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0B2E4A">
  <meta name="apple-mobile-web-app-title" content="DentalAudit">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="css/reports.css">
  <link rel="stylesheet" href="css/qi.css">
  <link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
  <div class="app" id="app">
    <!-- ============ Sidebar ============ -->
    <aside class="sidebar" id="sidebar" aria-label="Primary">
      <a class="brand" href="/" title="Back to all apps" aria-label="DentalAudit: back to all Notile apps">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </span>
        <span class="brand__name">DentalAudit</span>
      </a>

      <nav class="nav" id="nav">
        <p class="nav__label">Workspace</p>
        <a class="nav__item" href="#/dashboard" data-nav="dashboard"><span data-icon="dashboard"></span><span>Dashboard</span></a>
        <a class="nav__item" href="#/audits" data-nav="audits"><span data-icon="audits"></span><span>My Audits</span><span class="nav__count" id="nav-count-audits"></span></a>
        <a class="nav__item" href="#/create" data-nav="create"><span data-icon="create"></span><span>Create Audit</span></a>
        <a class="nav__item" href="#/collect" data-nav="collect"><span data-icon="collect"></span><span>Data Collection</span></a>
        <a class="nav__item" href="#/qi" data-nav="qi"><span data-icon="qi"></span><span>Quality Improvement</span><span class="nav__count nav__count--alert" id="nav-count-qi"></span></a>
        <p class="nav__label">Insight</p>
        <a class="nav__item" href="#/analytics" data-nav="analytics"><span data-icon="analytics"></span><span>Analytics</span></a>
        <a class="nav__item" href="#/reports" data-nav="reports"><span data-icon="reports"></span><span>Reports</span></a>
        <p class="nav__label">Account</p>
        <a class="nav__item" href="#/settings" data-nav="settings"><span data-icon="settings"></span><span>Settings</span></a>
      </nav>

      <div class="sidebar__foot">
        <div class="storage-note" id="storage-note">
          <span class="storage-note__dot"></span>
          <span>Saved in this browser</span>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ============ Main column ============ -->
    <div class="shell">
      <header class="topbar">
        <button class="icon-btn topbar__menu" id="menu-btn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>

        <div class="topbar__titles">
          <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
          <h1 class="topbar__title" id="page-title">Dashboard</h1>
        </div>

        <div class="topbar__actions">
          <div class="search" id="search">
            <span class="search__icon" data-icon="search"></span>
            <input id="search-input" type="search" placeholder="Search audits…" autocomplete="off" aria-label="Search audits" aria-controls="search-results">
            <kbd class="search__kbd">/</kbd>
            <div class="popover search__results" id="search-results" role="listbox" hidden></div>
          </div>

          <div class="menu-wrap">
            <button class="icon-btn" id="notif-btn" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false">
              <span data-icon="bell"></span><span class="dot" id="notif-dot" hidden></span>
            </button>
            <div class="popover popover--right notif" id="notif-panel" hidden></div>
          </div>

          <div class="menu-wrap">
            <button class="profile-btn" id="profile-btn" type="button" aria-haspopup="true" aria-expanded="false">
              <span class="avatar" id="avatar">CE</span>
              <span class="profile-btn__text">
                <span class="profile-btn__name" id="profile-name"></span>
                <span class="profile-btn__role" id="profile-role"></span>
              </span>
              <span data-icon="chevronDown"></span>
            </button>
            <div class="popover popover--right profile-menu" id="profile-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <main class="main" id="main" tabindex="-1">
        <div class="view" id="view"></div>
      </main>
    </div>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Vendor -->
  <script src="js/vendor/chart.umd.min.js"></script>

  <!-- Core -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/model.js"></script>
  <script src="js/core/collection.js"></script>
  <script src="js/core/templates.js"></script>
  <script src="js/core/seed.js"></script>
  <script src="js/core/metrics.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/router.js"></script>
  <script src="js/core/qi.js"></script>
  <script src="js/core/qi-store.js"></script>
  <script src="js/core/qi-report.js"></script>
  <script src="js/core/report-engine.js"></script>
  <script src="js/core/report-render.js"></script>
  <script src="js/core/ai-service.js"></script>
  <script src="js/core/report-export.js"></script>

  <!-- Views -->
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/audits.js"></script>
  <script src="js/views/audit-detail.js"></script>
  <script src="js/views/create-audit.js"></script>
  <script src="js/core/form-renderer.js"></script>
  <script src="js/views/data-collection.js"></script>
  <script src="js/views/form-builder.js"></script>
  <script src="js/views/case-entry.js"></script>
  <script src="js/views/compare.js"></script>
  <script src="js/views/qi.js"></script>
  <script src="js/views/pdsa.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/reports.js"></script>
  <script src="js/views/report-editor.js"></script>
  <script src="js/views/settings.js"></script>

  <!-- Shell -->
  <script src="js/app.js"></script>
</body>
</html>
